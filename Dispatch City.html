 if(HP<=0&&gameOn){HP=100;ST=100;if(vehicle){vehicle.speed=0;exitCar()}const d=LM.ems.door;P.x=d.x;P.z=d.z+2;S.money=Math.max(0,S.money-100);say('Knocked out. Treated at the ambulance station, -$100')}},100);
// ---------- loop ----------
let lastT=performance.now(),hT=0;
function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}
addEventListener('resize',resize);document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});
function frame(now){const dt=Math.min((now-lastT)/1000,.05);lastT=now;clock+=dt;toastT-=dt;updSig();
 if(gameOn&&!paused){const[t,s]=readIn();
  if(P.mode==='car'){stepCar(vehicle,dt,keys.Space?-1:t,-s);P.x=vehicle.x;P.z=vehicle.z;P.y=vehicle.y}else stepFoot(dt,t,s);
  if(S.duty){spawnT-=dt;if(spawnT<=0){spawnCall();spawnT=14+rnd()*10}}
  callsUpd(dt);charUpd()}
 for(const o of allCars())lightsUpd(o);
 camUpd(dt);renderer.render(scene,camera);
 hT+=dt;if(hT>.1){hT=0;if(gameOn)hudUpd()}
 requestAnimationFrame(frame)}
load();buildWorld();resize();openTitle();requestAnimationFrame(frame);
