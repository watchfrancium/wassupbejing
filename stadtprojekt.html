<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Dispatch City</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#a9d3f0;font-family:-apple-system,Helvetica,Arial,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hidden{display:none!important}
#rotate{position:fixed;inset:0;background:#0b0f14;color:#fff;display:none;align-items:center;justify-content:center;font-size:20px;text-align:center;z-index:99;padding:24px}
@media (orientation:portrait){#rotate{display:flex}}
.fullpanel{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.45);backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);z-index:20;padding:16px}
.tbox{text-align:center;color:#fff;width:min(560px,94vw);max-height:94vh;overflow:auto}
.tbox h1{font-size:52px;font-weight:800;letter-spacing:5px;margin:0 0 8px;text-shadow:0 4px 18px #000;background:linear-gradient(180deg,#ffffff,#c9d7e6);-webkit-background-clip:text;background-clip:text;color:transparent}
.tbox p{opacity:.85;margin:0 0 22px;text-shadow:0 2px 6px #000}
.tbox h2{margin:0 0 14px;font-size:24px;text-shadow:0 2px 6px #000}
.big{font:inherit;font-size:22px;font-weight:700;letter-spacing:1px;color:#fff;background:linear-gradient(180deg,#e0523f,#b8301f);border:0;border-radius:32px;padding:16px 60px;cursor:pointer;box-shadow:0 10px 26px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.25);transition:transform .1s,filter .15s}
.big:hover{filter:brightness(1.08)}
.big:active{transform:scale(.96)}
.link{font:inherit;color:#ddd;background:none;border:0;padding:12px;margin-top:8px;cursor:pointer;text-decoration:underline;font-size:15px}
.field{margin:0 0 16px;font-size:15px}
.field input{font:inherit;font-size:17px;padding:10px 14px;border-radius:10px;border:2px solid #556;background:rgba(10,14,20,.8);color:#fff;width:min(300px,80vw);margin-top:6px}
.swatchrow{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;margin:0 0 12px;font-size:14px}
.swatchrow span{width:86px;text-align:right;opacity:.85}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid rgba(255,255,255,.3);cursor:pointer;padding:0}
.sw.on{border-color:#ffe066;transform:scale(1.12)}
.card{background:linear-gradient(160deg,rgba(18,26,36,.86),rgba(8,12,18,.78));color:#fff;border-radius:14px;padding:9px 14px;font-size:14px;border:1px solid rgba(255,255,255,.12);box-shadow:0 6px 18px rgba(0,0,0,.35);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#hud{position:fixed;inset:0;pointer-events:none}
#tl{position:absolute;left:calc(env(safe-area-inset-left,0px) + 10px);top:calc(env(safe-area-inset-top,0px) + 10px);min-width:210px}
#who{font-weight:700;font-size:15px}
#status{margin-top:2px;font-size:13px;opacity:.9}
#money{margin-top:4px;font-variant-numeric:tabular-nums}
#mini{position:absolute;right:calc(env(safe-area-inset-right,0px) + 10px);top:calc(env(safe-area-inset-top,0px) + 10px);width:150px;height:150px;border-radius:12px;border:2px solid rgba(255,255,255,.45)}
#objective{position:absolute;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 10px);white-space:nowrap;font-weight:600;max-width:55vw;overflow:hidden;text-overflow:ellipsis}
#toast{position:absolute;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 58px);color:#ffe066;font-weight:700;white-space:nowrap;font-size:15px;background:rgba(8,12,18,.7);padding:6px 14px;border-radius:999px;border:1px solid rgba(255,224,102,.3);box-shadow:0 4px 14px rgba(0,0,0,.35)}
#progress{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 110px);width:240px;height:14px;background:rgba(0,0,0,.55);border-radius:7px;overflow:hidden;display:none;border:1px solid rgba(255,255,255,.4)}
#progFill{height:100%;width:0;background:linear-gradient(90deg,#ffd24a,#ffe066);box-shadow:0 0 10px rgba(255,224,102,.6)}
#joy{position:absolute;left:calc(env(safe-area-inset-left,0px) + 18px);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);width:132px;height:132px;border-radius:50%;background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.4);pointer-events:auto;touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:rgba(255,255,255,.6);pointer-events:none}
#btns{position:absolute;right:calc(env(safe-area-inset-right,0px) + 14px);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;gap:10px;align-items:flex-end;pointer-events:auto}
.round{min-width:70px;height:56px;border-radius:28px;border:1.5px solid rgba(255,255,255,.35);background:linear-gradient(180deg,rgba(40,50,64,.92),rgba(12,16,22,.92));color:#fff;font:inherit;font-weight:700;font-size:13px;letter-spacing:.4px;touch-action:manipulation;cursor:pointer;padding:0 8px;box-shadow:0 6px 16px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.12);transition:transform .08s,filter .15s}
.round:active{transform:scale(.94);filter:brightness(1.25)}
#bAction{width:124px;height:72px;border-radius:36px;background:rgba(190,40,30,.92);font-size:13px;line-height:1.1}
#bAction:disabled{opacity:.35}
#bJump{height:64px;width:64px;border-radius:50%}
#bJump:disabled{opacity:.35}
#bSiren.on{background:rgba(40,90,220,.95)}
.mk{position:fixed;left:0;top:0;pointer-events:none;color:#fff;text-align:center;font:700 11px Arial,sans-serif;text-shadow:0 1px 3px #000;z-index:12;display:none;will-change:transform}
.mk svg{width:34px;height:34px;display:block;margin:0 auto;filter:drop-shadow(0 2px 3px #000)}
.mk.job svg{color:#ff7a6e}
.mk.own svg{color:#ffffff}
.mk.edge span{display:none}
#panel{background:linear-gradient(180deg,#161e28,#0c1117);color:#fff;border-radius:18px;padding:22px;width:min(660px,96vw);max-height:92vh;overflow:auto;border:1px solid rgba(255,255,255,.08);box-shadow:0 20px 50px rgba(0,0,0,.6)}
#panel h1{letter-spacing:.5px}
#panel button{transition:background .15s,border-color .15s,transform .08s}
#panel button:not(:disabled):hover{background:#27364a;border-color:#5b7796}
#panel button:not(:disabled):active{transform:scale(.98)}
#panel h1{margin:0 0 6px;font-size:24px}
#panel p{margin:4px 0 10px;opacity:.85;font-size:14px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
#panel button{font:inherit;color:#fff;background:#1e2834;border:2px solid #34465a;border-radius:12px;padding:12px;text-align:left;min-height:48px;font-size:15px;cursor:pointer;display:block;width:100%;margin-top:8px}
#panel .opts button{margin-top:0}
#panel button:disabled{opacity:.4;cursor:default}
#panel button small{display:block;opacity:.75;font-weight:400;margin-top:4px;font-size:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #26313d}
.row .info{font-size:14px}
.row .info small{display:block;opacity:.7;font-size:12px;margin-top:2px}
.row button{width:auto!important;margin:0!important;min-width:120px;text-align:center!important}
#fade{position:fixed;inset:0;background:#000;opacity:0;transition:opacity .25s;pointer-events:none;z-index:30}
</style>
</head>
<body>
<canvas id="gl"></canvas>

<div id="hud" class="hidden">
  <div id="tl" class="card">
    <div id="who"></div>
    <div id="status"></div>
    <div id="money"></div>
  </div>
  <canvas id="mini" width="320" height="320"></canvas>
  <div id="objective" class="card"></div>
  <div id="toast"></div>
  <div id="progress"><div id="progFill"></div></div>
  <button id="bFounder" class="round" style="position:absolute;right:calc(env(safe-area-inset-right,0px) + 14px);top:172px;pointer-events:auto;height:40px;min-width:90px;font-size:11px">FOUNDER</button>
  <div id="joy"><div id="knob"></div></div>
  <div id="btns">
    <button id="bSiren" class="round">SIREN</button>
    <button id="bJump" class="round">JUMP</button>
    <button id="bAction" class="round" disabled>USE</button>
    <button id="bMenu" class="round">MENU</button>
  </div>
</div>

<div id="markOwn" class="mk own"><svg viewBox="0 0 24 24"><path d="M5 11l1.5-4.5h11L19 11v5h-2v2h-2v-2H9v2H7v-2H5z" fill="currentColor"/></svg><span>YOUR CAR</span></div>
<div id="markJob" class="mk job"><svg viewBox="0 0 24 24"><path d="M5 11l1.5-4.5h11L19 11v5h-2v2h-2v-2H9v2H7v-2H5z" fill="currentColor"/></svg><span>JOB CAR</span></div>

<div id="title" class="fullpanel">
  <div class="tbox">
    <h1>DISPATCH CITY</h1>
    <p>Hamburg. Live the job, drive the streets.</p>
    <button id="bPlay" class="big">Play</button><br>
    <button id="bNew" class="link hidden">New game</button>
  </div>
</div>

<div id="creator" class="fullpanel hidden">
  <div class="tbox">
    <h2>Create your character</h2>
    <div class="field">Name<br><input id="nm" maxlength="16" placeholder="Your name"></div>
    <div id="opts"></div>
    <button id="bStart" class="big">Start</button><br>
    <button id="bBack" class="link">Back</button>
  </div>
</div>

<div id="overlay" class="fullpanel hidden"><div id="panel"></div></div>
<div id="fade"></div>
<div id="rotate">Turn your iPhone sideways to play.</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ================= Layout =================
const GAP_X = [46, 56, 50, 62, 48, 54, 58];
const GAP_Z = [52, 48, 60, 50, 56, 46, 54];
function spread(gaps) {
  const a = [0];
  for (const g of gaps) a.push(a[a.length - 1] + g);
  const m = a[a.length - 1] / 2;
  return a.map(v => v - m);
}
const xs = spread(GAP_X), zs = spread(GAP_Z);
const NI = 8;
const COL_TYPE = ['residential', 'secondary', 'primary', 'residential', 'secondary', 'primary', 'secondary', 'residential'];
const ROW_TYPE = ['residential', 'secondary', 'residential', 'primary', 'residential', 'secondary', 'residential', 'secondary'];
const WIDTH = { primary: 22, secondary: 14, residential: 10 };
const colW = COL_TYPE.map(t => WIDTH[t]);
const rowW = ROW_TYPE.map(t => WIDTH[t]);
const BX0 = [], BX1 = [], BZ0 = [], BZ1 = [], BCX = [], BCZ = [], BW = [], BD = [];
for (let i = 0; i < 7; i++) {
  BX0[i] = xs[i] + colW[i] / 2 + 2.5;
  BX1[i] = xs[i + 1] - colW[i + 1] / 2 - 2.5;
  BCX[i] = (BX0[i] + BX1[i]) / 2;
  BW[i] = BX1[i] - BX0[i];
}
for (let j = 0; j < 7; j++) {
  BZ0[j] = zs[j] + rowW[j] / 2 + 2.5;
  BZ1[j] = zs[j + 1] - rowW[j + 1] / 2 - 2.5;
  BCZ[j] = (BZ0[j] + BZ1[j]) / 2;
  BD[j] = BZ1[j] - BZ0[j];
}
const LAKE = { x0: 9e4, x1: 9e4, z0: 9e4, z1: 9e4 };
const LAKE_KEY = {};
const WATER_Y = 0.6;
const MAP_LIM = 340;
const DEALER_SPAWN = { x: BCX[6] + 6, z: zs[4] - rowW[4] / 2 - 3 };
const KEY = 'dispatchRP.v4';

// Terrain. Gentle elevation in the city, hills outside, a carved river, and a lake.
function RIVER_C(x) { return 236 + 10 * Math.sin(x * 0.011); }
function smooth(a, b, x) { const t = Math.max(0, Math.min(1, (x - a) / (b - a))); return t * t * (3 - 2 * t); }
function H(x, z) {
  const r = Math.hypot(x, z);
  let h = 1.5 + 1.4 * Math.sin(x * 0.011 + 0.6) * Math.cos(z * 0.013) + 0.9 * Math.sin((x + z) * 0.021);
  h += smooth(230, 420, r) * (7 + 3 * Math.sin(x * 0.006 + 1) + 2 * Math.cos(z * 0.008));
  // Flat city core: the grid sits on one level, with hills only beyond the edges.
  const fx = smooth(xs[0] - 70, xs[0] - 30, x) * (1 - smooth(xs[7] + 30, xs[7] + 70, x));
  const fz = smooth(zs[0] - 70, zs[0] - 30, z) * (1 - smooth(zs[7] + 5, zs[7] + 15, z));
  const cf = fx * fz;
  h = h * (1 - cf) + 1.5 * cf;
  const dr = Math.abs(z - RIVER_C(x));
  h -= 4 * (1 - smooth(18, 46, dr));
  const sd = Math.max(LAKE.x0 - x, x - LAKE.x1, LAKE.z0 - z, z - LAKE.z1);
  const f = 1 - smooth(-6, 6, sd);
  h = h * (1 - f) + (-2.5) * f;
  return h;
}

const KEYS_UNUSED = null;
const JOBS = {
  fire:   { name: 'Fire Brigade', color: 0xd62b1f, blurb: 'Structure fires, car fires, warehouse blazes.' },
  police: { name: 'Police',       color: 0x2a4a99, blurb: 'Robberies, disturbances, hostage scenes.' },
  ems:    { name: 'Paramedics',   color: 0xe6e6eb, blurb: 'Cardiac arrests, falls, crash injuries.' },
};
const LANDMARKS = {
  fire:      { bi: 1, bj: 1, type: 'station',   label: 'Fire Station',      color: 0xd62b1f, sign: 'FEUERWACHE' },
  police:    { bi: 5, bj: 1, type: 'station',   label: 'Police Station',    color: 0x2a4a99, sign: 'POLIZEI' },
  ems:       { bi: 5, bj: 4, type: 'station',   label: 'Ambulance Station', color: 0xe6e6eb, sign: 'RETTUNG' },
  jobcenter: { bi: 3, bj: 5, type: 'jobcenter', label: 'Job Center',        color: 0x4a7f9a, sign: 'JOB CENTER' },
  dealer:    { bi: 6, bj: 3, type: 'dealer',    label: 'Car Dealer',        color: 0xdfe3e8, sign: 'AUTOHAUS' },
  townhall:  { bi: 3, bj: 3, type: 'deco',      label: 'Town Hall',         color: 0xd9c9a3, sign: 'RATHAUS' },
};
const LAND_KEY = {};
for (const k in LANDMARKS) LAND_KEY[LANDMARKS[k].bi + ',' + LANDMARKS[k].bj] = k;

const VEH = {
  engine:      { id: 'engine', job: 'fire',   name: 'Fire Engine',  cost: 0,    lvl: 1, max: 21, acc: 12, turn: 1.35, brk: 32, blurb: 'Pumper truck. Standard response.' },
  ladder:      { id: 'ladder', job: 'fire',   name: 'Ladder Truck', cost: 6500, lvl: 3, max: 19, acc: 9,  turn: 1.05, brk: 26, blurb: 'Aerial ladder for high-rise calls.' },
  patrol:      { id: 'patrol', job: 'police', name: 'Patrol Car',   cost: 0,    lvl: 1, max: 26, acc: 15, turn: 1.9,  brk: 34, blurb: 'Standard patrol unit.' },
  interceptor: { id: 'interceptor', job: 'police', name: 'Interceptor', cost: 4800, lvl: 2, max: 31, acc: 18, turn: 1.8, brk: 36, blurb: 'High-performance pursuit car.' },
  ambulance:   { id: 'ambulance', job: 'ems', name: 'Ambulance',     cost: 0,    lvl: 1, max: 24, acc: 13, turn: 1.6,  brk: 30, blurb: 'Transport and treatment unit.' },
  rescue:      { id: 'rescue', job: 'ems', name: 'Rescue Unit',    cost: 7200, lvl: 3, max: 21, acc: 11, turn: 1.35, brk: 30, blurb: 'Heavy rescue with extrication kit.' },
  sedan:       { id: 'sedan', personal: true, name: 'Sedan',     cost: 6000, acc: 14, turn: 1.7, brk: 30, max: 26, blurb: 'Comfortable family sedan.' },
  hatch:       { id: 'hatch', personal: true, name: 'Hatchback', cost: 4500, acc: 15, turn: 1.9, brk: 30, max: 24, blurb: 'Small and quick in the city.' },
  suv:         { id: 'suv', personal: true, name: 'SUV',         cost: 9000, acc: 12, turn: 1.5, brk: 30, max: 25, blurb: 'Big and solid.' },
};
const VEH_BY_JOB = { fire: ['engine', 'ladder'], police: ['patrol', 'interceptor'], ems: ['ambulance', 'rescue'] };
const CARSPEC = {
  engine:      { len: 6.2, wid: 2.5, bodyH: 1.5, cabL: 2.1, cabH: 0.9, cabZ: -1.9, body: 0xd62b1f, bar: true, cannon: true, stripe: 0xf4f4f4 },
  ladder:      { len: 9.4, wid: 2.6, bodyH: 1.6, cabL: 2.2, cabH: 0.9, cabZ: -3.1, body: 0xe0522a, bar: true, ladder: true, stripe: 0xf4f4f4 },
  patrol:      { len: 4.8, wid: 2.1, bodyH: 0.9, cabL: 2.0, cabH: 0.7, cabZ: -0.2, body: 0xf1f1f1, bar: true, stripe: 0x14161c },
  interceptor: { len: 4.9, wid: 2.0, bodyH: 0.85, cabL: 2.0, cabH: 0.65, cabZ: -0.2, body: 0x1f2b48, bar: true, stripe: 0xf4f4f4 },
  ambulance:   { len: 6.0, wid: 2.4, bodyH: 1.9, cabL: 1.6, cabH: 0.8, cabZ: -2.0, body: 0xf4f4f4, bar: true, cross: true, stripe: 0xef8a24 },
  rescue:      { len: 6.4, wid: 2.5, bodyH: 1.8, cabL: 1.8, cabH: 0.8, cabZ: -2.2, body: 0xe9772a, bar: true, cross: true, stripe: 0xf4f4f4 },
  sedan:       { len: 4.7, wid: 2.0, bodyH: 0.85, cabL: 2.2, cabH: 0.75, cabZ: -0.3, body: 0x3f6fb5 },
  hatch:       { len: 4.0, wid: 1.9, bodyH: 0.8,  cabL: 2.0, cabH: 0.72, cabZ: -0.1, body: 0xd6402b },
  suv:         { len: 5.0, wid: 2.2, bodyH: 1.1,  cabL: 2.5, cabH: 0.9,  cabZ: 0.1,  body: 0x2e8b57 },
  civ:         { len: 4.4, wid: 2.0, bodyH: 0.85, cabL: 2.0, cabH: 0.7,  cabZ: -0.4, body: 0x3f6fb5 },
};
const CIV_COLORS = [0x3f6fb5, 0xc0392b, 0xf5f5f5, 0x2c3e50, 0x7f8c8d, 0xf1c40f, 0x27ae60, 0x8e44ad];
const CALL_DEFS = {
  fire: [
    { id: 'house',     name: 'House fire',      action: 'Attack fire',        actTime: 6,  time: 150, reward: 900,  xp: 60,  min: 1, fx: true, color: 0xff6a1a },
    { id: 'carfire',   name: 'Car on fire',     action: 'Extinguish',         actTime: 4,  time: 110, reward: 500,  xp: 35,  min: 1, fx: true, color: 0xff4a1a },
    { id: 'warehouse', name: 'Warehouse blaze', action: 'Command and attack', actTime: 10, time: 200, reward: 2100, xp: 120, min: 3, fx: true, color: 0xff2a1a },
  ],
  police: [
    { id: 'robbery', name: 'Store robbery',     action: 'Detain suspect',   actTime: 6,  time: 140, reward: 800,  xp: 55,  min: 1, person: 'suspect', color: 0x3a7bff },
    { id: 'disturb', name: 'Disturbance',       action: 'Calm the scene',   actTime: 5,  time: 120, reward: 450,  xp: 30,  min: 1, person: 'suspect', color: 0x3a7bff },
    { id: 'hostage', name: 'Hostage situation', action: 'Secure the scene', actTime: 12, time: 220, reward: 2400, xp: 130, min: 4, person: 'suspect', color: 0x2255ff },
  ],
  ems: [
    { id: 'cardiac', name: 'Unresponsive person', action: 'Start CPR',      actTime: 7, time: 130, reward: 850,  xp: 55, min: 1, person: 'patient_lying', color: 0x3ddc6f },
    { id: 'fall',    name: 'Fall injury',         action: 'Treat patient',  actTime: 5, time: 120, reward: 500,  xp: 30, min: 1, person: 'patient',       color: 0x3ddc6f },
    { id: 'crash',   name: 'Crash with injuries', action: 'Treat patients', actTime: 8, time: 150, reward: 1200, xp: 80, min: 2, person: 'patient_lying', color: 0xf2cc33 },
  ],
};
const APP_OPTS = {
  skin:  [0xf1c8a4, 0xc68a5b, 0x8d5a3b],
  hair:  [0x2b1d12, 0xc9a25a, 0x9a9a9a],
  shirt: [0x3a6ea5, 0xd45f4e, 0x58a66a, 0xececec],
  pants: [0x2e3a4e, 0x222222, 0x6b5a3e],
};
const APP_LABEL = { skin: 'Skin', hair: 'Hair', shirt: 'Shirt', pants: 'Pants' };

// ================= State =================
function freshState() {
  return {
    name: null, app: null, money: 1000, rep: 50,
    xp: { fire: 0, police: 0, ems: 0 },
    lvl: { fire: 1, police: 1, ems: 1 },
    employer: null, duty: false,
    personal: null, pos: null,
    owned: { engine: true, patrol: true, ambulance: true },
    sel: { fire: 'engine', police: 'patrol', ems: 'ambulance' },
  };
}
let S = freshState();
let toastText = '', toastT = 0, clock = 0;
let cheatUsed = false, flying = false;
const CHEAT_CARS = [];
let gameOn = false, paused = false, transitioning = false;
let loc = 'out';
let vehicle = null, ownedCar = null, jobCar = null;
let calls = [], spawnT = 8;

function xpNeeded(l) { return Math.floor(100 * Math.pow(l, 1.5)); }
function addXp(job, amt) {
  S.xp[job] += amt; let g = 0;
  while (S.lvl[job] < 20 && S.xp[job] >= xpNeeded(S.lvl[job])) {
    S.xp[job] -= xpNeeded(S.lvl[job]); S.lvl[job]++; g++;
  }
  return g;
}
function save() {

      const mp = [];
      for (let z = BZ0[n]; z <= BZ1[n] + 0.01; z += 6) mp.push({ x: xs[i], z: z });

    new THREE.Vector3(xs[7] + 70, 3.5, zs[3]),
    new THREE.Vector3(xs[7] + 115, 6.5, zs[3]),
    new THREE.Vector3(329, 9, zs[3]),

  addRoad(rampA.map(v => ({ x: v.x, y: v.y, z: v.z })), 12, 'residential', { piers: true,
    });
  // Ramp heights: set explicitly from the curve (the call above used default heights, so overwrite them)
  for (let k = 0; k < rampA.length; k++) {
    const v = rampA[k];
    const pt = ROAD_PTS[ROAD_PTS.length - rampA.length + k];
    if (pt) pt.y = v.y;
  }
  const rampB = new THREE.CatmullRomCurve3([
    new THREE.Vector3(xs[0] - 26, H(xs[0] - 26, zs[4]) + 0.1, zs[4]),
    new THREE.Vector3(xs[0] - 70, 3.5, zs[4]),
    new THREE.Vector3(xs[0] - 115, 6.5, zs[4]),
    new THREE.Vector3(-329, 9, zs[4]),
  ]).getPoints(30);
  addRoad(rampB.map(v => ({ x: v.x, y: v.y, z: v.z })), 12, 'residential', { piers: true });
  for (let k = 0; k < rampB.length; k++) {
    const v = rampB[k];
    const pt = ROAD_PTS[ROAD_PTS.length - rampB.length + k];
    if (pt) pt.y = v.y;
  }

  // Blocks: buildings, parks, stations and landmarks
  for (let bi = 0; bi < 7; bi++) for (let bj = 0; bj < 7; bj++) buildBlock(bi, bj, R);

  // Intersections: signals and crosswalks

}

    _dummy.scale.set(it.s ? it.s[0] : 1, it.s ? it.s[1] : 1, it.s ? it.s[2] : 1);

}
function sigState(s, ns) {

}
function updateSignals() {

      s.ns[k].emissiveIntensity = a === st[k] ? 1.4 : 0.04;

// ================= Traffic (grid streets, obeys signals) =================
function inb(i, j) { return i >= 0 && i < NI && j >= 0 && j < NI; }
function nextOptions(i, j, di, dj) {
  const opts = [[di, dj], [-dj, di], [dj, -di]].filter(([a, b]) => inb(i + a, j + b));
  if (opts.length === 0) return [[-di, -dj]];
  return opts;
}
function segLen(tr) {
  return tr.di !== 0 ? Math.abs(xs[tr.i + tr.di] - xs[tr.i]) : Math.abs(zs[tr.j + tr.dj] - zs[tr.j]);
}
const TRAFFIC = [];
const LANE = 3.0;
function spawnTraffic(n) {
  const dirs = [[1, 0], [-1, 0], [0, 1], [0, -1]];
  for (let k = 0; k < n; k++) {
    const i = (Math.random() * NI) | 0, j = (Math.random() * NI) | 0;
    const valid = dirs.filter(([a, b]) => inb(i + a, j + b));
    const d = valid[(Math.random() * valid.length) | 0];
    const built = buildCar(CARSPEC.civ, CIV_COLORS[k % CIV_COLORS.length]);
    scene.add(built.g);
    const tr = { i: i, j: j, di: d[0], dj: d[1], s: 0, spd: 8 + Math.random() * 5, g: built.g, wheels: built.wheels, bump: 0 };
    tr.s = Math.random() * segLen(tr);
    TRAFFIC.push(tr);
  }
}
function updateTraffic(dt) {
  for (const tr of TRAFFIC) {
    const L = segLen(tr);
    const ti = tr.i + tr.di, tj = tr.j + tr.dj;
    const sig = sigAt(ti, tj);
    let hold = false;
    if (sig && tr.s > L - 8 && sigState(sig, tr.dj !== 0) === 'r') hold = true;
    if (hold) tr.s = Math.min(tr.s, L - 8);
    else tr.s += tr.spd * dt;
    if (tr.s >= L) {
      tr.s -= L;
      tr.i = ti; tr.j = tj;
      const opts = nextOptions(tr.i, tr.j, tr.di, tr.dj);
      const pk = opts[(Math.random() * opts.length) | 0];
      tr.di = pk[0]; tr.dj = pk[1];
    }
    const dx = tr.di, dz = tr.dj;
    const x = xs[tr.i] + dx * tr.s - dz * LANE, z = zs[tr.j] + dz * tr.s + dx * LANE;
    tr.g.position.set(x, surfaceAt(x, z), z);
    tr.g.rotation.y = Math.atan2(-dx, -dz);
    if (!hold) for (const w of tr.wheels) w.rotation.x += tr.spd * dt / 0.42;
  }
}
function collideTraffic() {
  for (const tr of TRAFFIC) {
    if (tr.bump > 0) { tr.bump -= 1 / 60; continue; }
    const d = Math.hypot(vehicle.x - tr.g.position.x, vehicle.z - tr.g.position.z);
    if (d < 3.4) { vehicle.speed *= 0.45; tr.bump = 1.2; say('Collision. Watch the traffic.'); }
  }
}

// ================= Player =================
const player = { x: 0, z: 0, h: 0, y: 0, jy: 0, vy: 0, onGround: true, mode: 'foot', g: null, legL: null, legR: null, armL: null, armR: null, phase: 0, moving: false, yLevel: 0 };

function buildCharacter() {
  if (player.g) scene.remove(player.g);
  const a = S.app || { skin: APP_OPTS.skin[0], hair: APP_OPTS.hair[0], shirt: APP_OPTS.shirt[0], pants: APP_OPTS.pants[0] };
  const g = new THREE.Group();
  const SKIN = a.skin;
  const legL = new THREE.Group(), legR = new THREE.Group();
  legL.position.set(-0.17, 0.9, 0); legR.position.set(0.17, 0.9, 0);
  for (const lg of [legL, legR]) {
    part(new THREE.CylinderGeometry(0.13, 0.12, 0.9, 8), a.pants, 0, -0.45, 0, lg);
    part(new THREE.BoxGeometry(0.22, 0.14, 0.34), SHOE, 0, -0.92, -0.05, lg);
    g.add(lg);
  }
  part(rbox(0.6, 0.75, 0.34, 0.1), a.shirt, 0, 1.25, 0, g);
  if (S.duty && S.employer) part(new THREE.BoxGeometry(0.62, 0.5, 0.06), JOBS[S.employer].color, 0, 1.25, -0.19, g);
  const armL = new THREE.Group(), armR = new THREE.Group();
  armL.position.set(-0.42, 1.6, 0); armR.position.set(0.42, 1.6, 0);
  for (const ar of [armL, armR]) {
    part(new THREE.CylinderGeometry(0.09, 0.08, 0.7, 8), a.shirt, 0, -0.35, 0, ar);
    part(new THREE.SphereGeometry(0.09, 8, 6), SKIN, 0, -0.75, 0, ar);
    g.add(ar);
  }
  part(new THREE.SphereGeometry(0.2, 12, 10), SKIN, 0, 1.92, 0, g);
  part(new THREE.SphereGeometry(0.215, 10, 6, 0, Math.PI * 2, 0, Math.PI / 2), a.hair, 0, 1.97, 0.02, g);
  scene.add(g);
  Object.assign(player, { g: g, legL: legL, legR: legR, armL: armL, armR: armR });
}
function solidsNow() { return loc === 'out' ? OUT_SOLIDS : INT[loc].solids; }

// Walking: movement is relative to the camera.
function stepFoot(dt, thr, str) {
  const fx = -Math.sin(cam.yaw), fz = -Math.cos(cam.yaw);
  const rx = Math.cos(cam.yaw), rz = -Math.sin(cam.yaw);
  const f = thr, l = -str;
  let dx = fx * f + rx * l, dz = fz * f + rz * l;
  const mag = Math.hypot(dx, dz);
  player.moving = mag > 0.05;
  if (player.moving) {
    dx /= mag; dz /= mag;
    const want = Math.atan2(-dx, -dz);
    player.h += clamp(wrap(want - player.h), -12 * dt, 12 * dt);
    const sp = 6.5 * Math.min(1, mag);
    player.x += dx * sp * dt;
    player.z += dz * sp * dt;
    player.phase += dt * sp * 1.4;
  }
  collide(player, 0.6, solidsNow());
  if (loc === 'out') clampMap(player);
  // Vertical: ground follows the road or terrain under the player, plus the jump arc.
  if (loc === 'out') {
    player.yLevel = surfaceAt(player.x, player.z);
  } else {
    player.yLevel = 0;
  }
  player.vy -= 24 * dt;
  player.jy += player.vy * dt;
  if (player.jy <= 0) { player.jy = 0; player.vy = 0; player.onGround = true; }
  else player.onGround = false;
  player.y = player.yLevel + player.jy;
}
function jump() {
  if (player.mode !== 'foot' || !player.onGround || !gameOn || paused) return;
  player.vy = 8.0;
  player.onGround = false;
}
function updateCharacter() {
  if (!player.g) return;
  player.g.visible = player.mode !== 'car';
  player.g.position.set(player.x, player.y, player.z);
  player.g.rotation.y = player.h;
  const amp = player.moving && player.onGround ? 0.7 : 0;
  const s = Math.sin(player.phase) * amp;
  player.legL.rotation.x = s;
  player.legR.rotation.x = -s;
  player.armL.rotation.x = -s * 0.8;
  player.armR.rotation.x = s * 0.8;
  if (!player.onGround) { player.legL.rotation.x = 0.5; player.legR.rotation.x = -0.3; }
}

// ================= Vehicle physics =================
function stepCar(o, dt, thr, str) {
  if (thr > 0.05) o.speed += o.acc * thr * dt;
  else if (thr < -0.05) {
    if (o.speed > 0.5) o.speed -= o.brk * (-thr) * dt;
    else o.speed -= o.acc * 0.5 * dt;
  } else {
    o.speed -= Math.sign(o.speed) * Math.min(Math.abs(o.speed), 3 * dt);
  }
  o.speed = clamp(o.speed, -8, o.max);
  const k = clamp(Math.abs(o.speed) / 8, 0, 1) * Math.sign(o.speed);
  o.h += str * o.turn * k * dt;
  o.x += -Math.sin(o.h) * o.speed * dt;
  o.z += -Math.cos(o.h) * o.speed * dt;
  o.yLevel = surfaceAt(o.x, o.z);
  collide(o, 2.0, OUT_SOLIDS);
  clampMap(o);
  o.y = surfaceAt(o.x, o.z);
  o.g.position.set(o.x, o.y, o.z);
  o.g.rotation.y = o.h;
  for (const w of o.wheels) w.rotation.x += o.speed * dt / 0.42;
}
function enterCar(v) {
  player.mode = 'car';
  vehicle = v;
  cam.dist = 9; cam.pitch = 0.32;
  say('Driving ' + v.name);
}
function exitCar() {
  if (Math.abs(vehicle.speed) > 3) { say('Stop before getting out'); return; }
  player.x = vehicle.x + Math.cos(vehicle.h) * 2.6;
  player.z = vehicle.z - Math.sin(vehicle.h) * 2.6;
  player.h = vehicle.h + Math.PI / 2;
  player.jy = 0; player.vy = 0; player.onGround = true;
  player.mode = 'foot';
  vehicle = null;
  cam.dist = 6; cam.pitch = 0.3;
}

// ================= Camera (orbits the head; drag to look) =================
const cam = { yaw: 0, pitch: 0.3, roll: 0, dist: 6, lastDrag: -99 };
function updateCameraRig(dt) {
  if (!gameOn) {
    const a = clock * 0.05;
    camera.up.set(0, 1, 0);
    camera.position.set(Math.cos(a) * 330, 230, Math.sin(a) * 330);
    camera.lookAt(0, 0, 0);
    return;
  }
  const inCar = player.mode === 'car' && vehicle;
  const px = inCar ? vehicle.x : player.x;
  const pz = inCar ? vehicle.z : player.z;
  const ph = inCar ? vehicle.h : player.h;
  const base = inCar ? vehicle.y : player.y;
  const py = loc !== 'out' ? 1.8 : base + (inCar ? 1.6 : 1.8);
  if (clock - cam.lastDrag > 1.2) {
    cam.yaw += clamp(wrap(ph - cam.yaw), -3 * dt, 3 * dt);
    cam.roll *= (1 - Math.min(1, dt * 2));
  }
  const cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch);
  camera.position.set(px + Math.sin(cam.yaw) * cp * cam.dist, py + sp * cam.dist, pz + Math.cos(cam.yaw) * cp * cam.dist);
  camera.up.set(Math.sin(cam.roll), Math.cos(cam.roll), 0);
  camera.lookAt(px, py, pz);
}

// ================= Calls (only while on duty) =================
function hyp(a, b) { return Math.hypot(a.x - b.x, a.z - b.z); }
function spawnCall() {
  if (!S.duty || !S.employer || calls.length >= 3) return;
  const defs = CALL_DEFS[S.employer].filter(d => S.lvl[S.employer] >= d.min);
  if (!defs.length) return;
  const def = defs[(Math.random() * defs.length) | 0];
  let x, z;
  if (Math.random() < 0.5) { x = xs[(Math.random() * 8) | 0]; z = zs[0] + Math.random() * (zs[7] - zs[0]); }
  else { z = zs[(Math.random() * 8) | 0]; x = xs[0] + Math.random() * (xs[7] - xs[0]); }
  if (hyp(player, { x: x, z: z }) < 70) return;
  const g = new THREE.Group();
  g.position.set(x, surfaceAt(x, z), z);
  scene.add(g);
  const beam = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 0.6, 80, 8, 1, true),
    new THREE.MeshBasicMaterial({ color: def.color, transparent: true, opacity: 0.35, depthWrite: false }));
  beam.position.y = 40;
  g.add(beam);
  const ring = new THREE.Mesh(new THREE.CylinderGeometry(4.5, 4.5, 0.1, 24),
    new THREE.MeshBasicMaterial({ color: def.color, transparent: true, opacity: 0.6 }));
  ring.position.y = 0.1;
  g.add(ring);
  if (def.person) {
    const p = buildPerson(def.person);
    p.position.x += 3.5; p.position.z += 3;
    g.add(p);
  }
  let fire = null;
  if (def.fx) { fire = makeFire(); fire.g.position.set(4, 0, 4); g.add(fire.g); }
  calls.push({ def: def, x: x, z: z, g: g, t: def.time, prog: 0, working: false, fire: fire });
  say('New call: ' + def.name);
}
function makeFire() {
  const g = new THREE.Group();
  const parts = [];
  for (let i = 0; i < 9; i++) {
    const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: fireTex, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
    s.position.set((Math.random() - 0.5) * 4, 1 + Math.random() * 1.5, (Math.random() - 0.5) * 4);
    s.userData = { smoke: false, base: 3 + Math.random() * 2, ph: Math.random() * 6 };
    s.scale.set(s.userData.base, s.userData.base, 1);
    g.add(s); parts.push(s);
  }
  for (let i = 0; i < 6; i++) {
    const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: smokeTex, transparent: true, depthWrite: false, opacity: 0.6 }));
    s.position.set((Math.random() - 0.5) * 3, 4, (Math.random() - 0.5) * 3);
    s.userData = { smoke: true, base: 4 + Math.random() * 3, y: 4, ph: Math.random() * 6 };
    s.scale.set(s.userData.base, s.userData.base, 1);
    g.add(s); parts.push(s);
  }
  return { g: g, parts: parts };
}
function animFire(f, t) {
  for (const s of f.parts) {
    const u = s.userData;
    if (u.smoke) {
      const rise = (t * 1.2 + u.ph) % 6;
      s.position.y = u.y + rise;
      s.material.opacity = 0.6 * (1 - rise / 6);
      s.scale.setScalar(u.base * (1 + rise * 0.08));
    } else {
      const k = 0.85 + 0.25 * Math.sin(t * 9 + u.ph);
      s.scale.set(u.base * k, u.base * 1.2 * k, 1);
    }
  }
}
function removeCall(c) {
  c.g.traverse(o => { if (o.geometry) o.geometry.dispose(); });
  scene.remove(c.g);
  calls = calls.filter(x => x !== c);
}
function clearCalls() { for (const c of calls.slice()) removeCall(c); }
function inRange(c) { return loc === 'out' && player.mode === 'foot' && hyp(player, c) < 5; }
function doAction() {
  ensureAudio();
  const c = calls.find(x => inRange(x) && !x.working);
  if (!c) { say('Get closer on foot'); return; }
  c.working = true; c.prog = 0;
  say(c.def.action + '...');
}
function updateCalls(dt) {
  for (const c of calls.slice()) {
    c.t -= dt;
    if (c.working) {
      if (!inRange(c)) { c.working = false; c.prog = 0; say('Action cancelled'); }
      else {
        c.prog += dt;
        if (c.prog >= c.def.actTime) { completeCall(c); continue; }
      }
    }
    if (c.t <= 0) { failCall(c); continue; }
    if (c.fire) animFire(c.fire, clock);
  }
}
function completeCall(c) {
  const pay = c.def.reward + Math.floor(c.t) * 2;
  S.money += pay;
  S.rep = Math.min(100, S.rep + 2);
  const gained = addXp(S.employer, c.def.xp);
  removeCall(c);
  save();
  say(c.def.name + ' resolved. +$' + pay + (gained ? '. Rank up to ' + S.lvl[S.employer] : ''));
}
function failCall(c) {
  S.rep = Math.max(0, S.rep - 4);
  say('Call lost: ' + c.def.name);
  removeCall(c);
  save();
}

function transition(fn) {
  if (transitioning) return;
  transitioning = true;
  $('fade').style.opacity = 1;
  setTimeout(() => {
    fn();
    setTimeout(() => { $('fade').style.opacity = 0; transitioning = false; }, 60);
  }, 260);
}
function enterBuilding(key) {
  const room = INT[key];
  transition(() => {
    loc = key;
    player.x = room.spawn.x; player.z = room.spawn.z; player.h = 0;
    player.jy = 0; player.vy = 0; player.onGround = true;
    player.mode = 'foot';
    scene.fog = null;
    cam.yaw = 0; cam.pitch = 0.85; cam.dist = 11;
  });
}
function exitBuilding() {
  const L = LANDMARKS[loc];

    loc = 'out';
    player.x = L.door.x; player.z = L.door.z + 1.6; player.h = Math.PI;
    player.jy = 0; player.vy = 0; player.onGround = true;

function placeJobCar(key) {

function toggleDuty(key) {

    say('You work as ' + JOBS[S.employer].name + '. Clock in at the ' + LANDMARKS[S.employer].label + '.');

    say('Off duty');

  S.duty = true;

}

function buyPersonal(kind, color) {
  const v = VEH[kind];
  const refund = ownedCar ? Math.floor(VEH[ownedCar.id].cost / 2) : 0;
  if (S.money + refund < v.cost) { say('Not enough money'); return; }
  S.money += refund - v.cost;
  if (ownedCar) removeCarObj(ownedCar);
  ownedCar = makeCarObj(kind, DEALER_SPAWN.x, DEALER_SPAWN.z, 0, color);
  save();
  say('Bought a ' + v.name + (refund ? '. Trade-in $' + refund : ''));
  openDealer();
}

  loc = 'out';
  scene.fog = FOG;
  if (S.pos) { player.x = S.pos.x; player.z = S.pos.z; player.h = S.pos.h; }
  else { player.x = BCX[3]; player.z = zs[4]; player.h = Math.PI / 2; }
  player.jy = 0; player.vy = 0; player.onGround = true;
  player.mode = 'foot';
  vehicle = null;
  buildCharacter();
  clearCalls();
  if (S.personal && !ownedCar) ownedCar = makeCarObj(S.personal.id, S.personal.x, S.personal.z, S.personal.h, S.personal.color);
  if (S.duty && S.employer) placeJobCar(S.employer);
  cam.yaw = player.h; cam.pitch = 0.3; cam.dist = 6;
  say(S.duty ? 'Back on duty' : 'Welcome, ' + S.name);
}

// ================= Audio (siren) =================
let AC = null, sirenNodes = null;
function ensureAudio() {
  try {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
  } catch (e) {}
}
function sirenSet(on) {
  if (!AC) return;
  if (on && !sirenNodes) {
    const o = AC.createOscillator(), g = AC.createGain();
    const l = AC.createOscillator(), lg = AC.createGain();
    o.type = 'sawtooth'; o.frequency.value = 700;
    g.gain.value = 0.03;
    l.frequency.value = 0.5; lg.gain.value = 220;
    l.connect(lg); lg.connect(o.frequency);
    o.connect(g); g.connect(AC.destination);
    o.start(); l.start();
    sirenNodes = { o: o, l: l };
  } else if (!on && sirenNodes) {
    sirenNodes.o.stop(); sirenNodes.l.stop();
    sirenNodes = null;
  }
}
function toggleSiren() {
  ensureAudio();
  if (player.mode !== 'car' || !vehicle || !vehicle.hasBar) return;
  vehicle.siren = !vehicle.siren;
  sirenSet(vehicle.siren);
  $('bSiren').classList.toggle('on', vehicle.siren);
}

// ================= Prompts =================
function getPrompt() {
  if (!gameOn) return null;
  if (player.mode === 'car') {
    return Math.abs(vehicle.speed) < 3 ? { label: 'Exit car', fn: exitCar } : null;
  }
  if (loc === 'out') {
    const c = calls.find(x => inRange(x) && !x.working);
    if (c) return { label: c.def.action, fn: doAction };
    for (const v of [ownedCar, jobCar, ...CHEAT_CARS]) {
      if (v && hyp(player, v) < 4.5) return { label: 'Enter ' + (v.personal ? 'car' : 'vehicle'), fn: () => enterCar(v) };
    }
    for (const k in LANDMARKS) {
      const L = LANDMARKS[k];
      if (L.type === 'deco' || !L.door) continue;
      if (Math.hypot(player.x - L.door.x, player.z - L.door.z) < 3.5) {
        return { label: 'Enter ' + L.label, fn: () => enterBuilding(k) };
      }
    }
    return null;
  }
  for (const p of INT[loc].points) {
    if (Math.hypot(player.x - p.x, player.z - p.z) < 3.2) {
      return { label: typeof p.label === 'function' ? p.label() : p.label, fn: p.act };
    }
  }
  return null;
}
function runPrompt() {
  const p = getPrompt();
  if (p) p.fn();
}

// ================= Input =================
const keys = {};
let joyX = 0, joyY = 0;
window.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code.startsWith('Arrow')) e.preventDefault();
  keys[e.code] = true;
  if (e.code === 'Space' && !e.repeat) jump();
  if (e.code === 'KeyQ' && !e.repeat) toggleSiren();
  if (e.code === 'KeyE' && !e.repeat) runPrompt();
  if (e.code === 'Escape' && gameOn && !e.repeat) {
    if (overlay.classList.contains('hidden')) openPause(); else closePanel();
  }
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

const joy = $('joy'), knob = $('knob');
let joyId = -1;
function moveKnob(e) {
  const r = joy.getBoundingClientRect();
  const cx = r.left + r.width / 2, cy = r.top + r.height / 2, R = 55;
  let dx = e.clientX - cx, dy = e.clientY - cy;
  const d = Math.hypot(dx, dy);
  if (d > R) { dx *= R / d; dy *= R / d; }
  joyX = Math.abs(dx / R) < 0.1 ? 0 : dx / R;
  joyY = Math.abs(dy / R) < 0.1 ? 0 : dy / R;
  knob.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
}
function joyEnd() { joyId = -1; joyX = 0; joyY = 0; knob.style.transform = ''; }
joy.addEventListener('pointerdown', e => { joyId = e.pointerId; joy.setPointerCapture(e.pointerId); ensureAudio(); moveKnob(e); });
joy.addEventListener('pointermove', e => { if (e.pointerId === joyId) moveKnob(e); });
joy.addEventListener('pointerup', e => { if (e.pointerId === joyId) joyEnd(); });
joy.addEventListener('pointercancel', joyEnd);

$('bSiren').addEventListener('click', () => { if (flying) { player.y = Math.max(0.5, player.y - 6); return; } toggleSiren(); });
$('bJump').addEventListener('click', () => { ensureAudio(); if (flying) { player.y += 6; return; } jump(); });
$('bAction').addEventListener('click', runPrompt);
$('bMenu').addEventListener('click', () => { ensureAudio(); if (gameOn) openPause(); });

// Camera: touch drag or right-mouse drag rotates. Shift + right-drag rolls. Two fingers pinch and twist.
const ptrs = new Map();
let pairLast = null;
canvas.addEventListener('contextmenu', e => e.preventDefault());
canvas.addEventListener('pointerdown', e => {
  if (!gameOn || paused) return;
  if (e.pointerType === 'mouse' && e.button !== 2) return;
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY, mouse: e.pointerType === 'mouse' });
  canvas.setPointerCapture(e.pointerId);
  cam.lastDrag = clock;
  pairLast = null;
});
canvas.addEventListener('pointermove', e => {
  const p = ptrs.get(e.pointerId);
  if (!p) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y;
  p.x = e.clientX; p.y = e.clientY;
  cam.lastDrag = clock;
  if (ptrs.size === 1) {
    if (p.mouse && e.shiftKey) cam.roll = clamp(cam.roll + dx * 0.004, -0.6, 0.6);
    else {
      cam.yaw -= dx * 0.007;
      cam.pitch = clamp(cam.pitch + dy * 0.005, 0.05, 1.35);
    }
  } else if (ptrs.size >= 2) {
    const v = [...ptrs.values()];
    const d = Math.hypot(v[0].x - v[1].x, v[0].y - v[1].y);
    const a = Math.atan2(v[1].y - v[0].y, v[1].x - v[0].x);
    if (pairLast) {
      cam.dist = clamp(cam.dist + (pairLast.d - d) * 0.04, 3, 22);
      cam.roll = clamp(cam.roll + wrap(a - pairLast.a) * 0.8, -0.6, 0.6);
    }
    pairLast = { d: d, a: a };
  }
});
function endPtr(e) { ptrs.delete(e.pointerId); pairLast = null; }
canvas.addEventListener('pointerup', endPtr);
canvas.addEventListener('pointercancel', endPtr);
canvas.addEventListener('wheel', e => {
  cam.dist = clamp(cam.dist + e.deltaY * 0.01, 3, 22);
  e.preventDefault();
}, { passive: false });

function readInput() {
  let thr = 0, str = 0;
  if (keys.ArrowUp || keys.KeyW) thr += 1;
  if (keys.ArrowDown || keys.KeyS) thr -= 1;
  if (keys.ArrowLeft || keys.KeyA) str += 1;
  if (keys.ArrowRight || keys.KeyD) str -= 1;
  thr += -joyY;
  str += -joyX;
  return [clamp(thr, -1, 1), clamp(str, -1, 1)];
}

// ================= Car markers =================
const _pv = new THREE.Vector3();
function placeMark(el, obj) {
  if (!obj || !gameOn || loc !== 'out' || obj === vehicle) { el.style.display = 'none'; return; }
  _pv.set(obj.x, obj.y + 2.4, obj.z).project(camera);
  const sx = (_pv.x * 0.5 + 0.5) * window.innerWidth, sy = (-_pv.y * 0.5 + 0.5) * window.innerHeight;
  const behind = _pv.z > 1;
  const m = 44;
  const inside = !behind && sx > m && sx < window.innerWidth - m && sy > m && sy < window.innerHeight - m;
  el.style.display = 'block';
  if (inside) {
    el.classList.remove('edge');
    el.style.transform = 'translate(' + sx + 'px,' + sy + 'px) translate(-50%,-100%)';
    el.firstElementChild.style.transform = 'rotate(0deg)';
  } else {
    const cx = window.innerWidth / 2, cy = window.innerHeight / 2;
    let dx = sx - cx, dy = sy - cy;
    if (behind) { dx = -dx; dy = -dy; }
    const k = Math.min((window.innerWidth / 2 - m) / Math.abs(dx || 1e-6), (window.innerHeight / 2 - m) / Math.abs(dy || 1e-6));
    el.style.transform = 'translate(' + (cx + dx * k) + 'px,' + (cy + dy * k) + 'px) translate(-50%,-50%)';
    el.firstElementChild.style.transform = 'rotate(' + (Math.atan2(dy, dx) * 180 / Math.PI + 90) + 'deg)';
    el.classList.add('edge');
  }
}

// ================= HUD and mini-map =================
const mini = $('mini').getContext('2d');
const MINI_S = 320 / (Math.max(xs[7] - xs[0], zs[7] - zs[0]) + 150);
function mx(x) { return 160 + x * MINI_S; }
function my(z) { return 160 + z * MINI_S; }
function strokeLine(pts, widthWorld, color) {
  mini.strokeStyle = color;
  mini.lineWidth = Math.max(1, widthWorld * MINI_S);
  mini.lineCap = 'round';
  mini.beginPath();
  pts.forEach((p, i) => (i ? mini.lineTo(mx(p.x), my(p.z)) : mini.moveTo(mx(p.x), my(p.z))));
  mini.stroke();
}
function drawMini() {
  mini.fillStyle = '#5c8a4c'; mini.fillRect(0, 0, 320, 320);
  mini.fillStyle = '#bdb8ae';
  mini.fillRect(mx(xs[0] - 22), my(zs[0] - 22), (xs[7] - xs[0] + 44) * MINI_S, (zs[7] - zs[0] + 44) * MINI_S);
  // River and lake
  const rp = []; for (let x = -380; x <= 380; x += 20) rp.push({ x: x, z: RIVER_C(x) });
  strokeLine(rp, 70, '#3b7fb0');
  mini.fillStyle = '#3b7fb0';
  mini.fillRect(mx(LAKE.x0), my(LAKE.z0), (LAKE.x1 - LAKE.x0) * MINI_S, (LAKE.z1 - LAKE.z0) * MINI_S);
  // Ring road, highway and ramps: drawn from their centre lines
  const ring = []; for (let a = 0; a <= 360; a += 4) { const t = a * Math.PI / 180; ring.push({ x: 275 * Math.cos(t), z: 275 * Math.sin(t) }); }
  strokeLine(ring, 14, '#4a4e55');
  const hwp = []; for (let a = -10; a <= 350; a += 4) { const t = a * Math.PI / 180; hwp.push({ x: 330 * Math.cos(t), z: 330 * Math.sin(t) }); }
  strokeLine(hwp, 20, '#6a6f78');
  // Grid streets
  for (let j = 0; j < 8; j++) strokeLine([{ x: xs[0] - 26, z: zs[j] }, { x: xs[7] + 26, z: zs[j] }], rowW[j], ROW_TYPE[j] === 'primary' ? '#6a6f78' : '#3a3e44');
  for (let i = 0; i < 8; i++) strokeLine([{ x: xs[i], z: zs[0] - 26 }, { x: xs[i], z: zs[7] + 26 }], colW[i], COL_TYPE[i] === 'primary' ? '#6a6f78' : '#3a3e44');
  mini.fillStyle = '#9aa0a8';
  for (const b of EXT_SOLIDS) if (!b.water) mini.fillRect(mx(b.x0), my(b.z0), (b.x1 - b.x0) * MINI_S, (b.z1 - b.z0) * MINI_S);
  for (const k in LANDMARKS) {
    const L = LANDMARKS[k];
    const fp = L.fp || 20;
    mini.fillStyle = '#' + L.color.toString(16).padStart(6, '0');
    mini.fillRect(mx(BCX[L.bi] - fp / 2), my(BCZ[L.bj] - fp / 2), fp * MINI_S, fp * MINI_S);
  }
  for (const c of calls) {
    mini.fillStyle = '#' + c.def.color.toString(16).padStart(6, '0');
    mini.beginPath(); mini.arc(mx(c.x), my(c.z), 5, 0, Math.PI * 2); mini.fill();
  }
  if (loc === 'out') {
    if (player.mode === 'car') {
      const fx = -Math.sin(vehicle.h), fz = -Math.cos(vehicle.h);
      mini.save(); mini.translate(mx(vehicle.x), my(vehicle.z));
      mini.rotate(Math.atan2(fz, fx) + Math.PI / 2);
      mini.fillStyle = '#ffffff';
      mini.beginPath(); mini.moveTo(0, -9); mini.lineTo(6, 7); mini.lineTo(-6, 7); mini.closePath(); mini.fill();
      mini.restore();
    } else {
      mini.fillStyle = '#ffffff';
      mini.beginPath(); mini.arc(mx(player.x), my(player.z), 4, 0, Math.PI * 2); mini.fill();
    }
  } else {
    mini.fillStyle = 'rgba(0,0,0,.6)'; mini.fillRect(0, 0, 320, 320);
    mini.fillStyle = '#fff'; mini.font = 'bold 22px Arial'; mini.textAlign = 'center';
    mini.fillText('Inside', 160, 160);
  }
}
function updateHUD() {
  $('who').textContent = S.name || 'Civilian';
  $('status').textContent = S.employer
    ? JOBS[S.employer].name + ' · Rank ' + S.lvl[S.employer] + ' · ' + (S.duty ? 'ON DUTY' : 'Off duty')
    : 'Unemployed · Civilian';
  let st = '$' + S.money.toLocaleString('en-US') + '   Rep ' + S.rep;
  if (player.mode === 'car') st += '   ' + Math.round(Math.abs(vehicle.speed) * 3.6) + ' km/h';
  $('money').textContent = st;

  let obj;
  if (loc !== 'out') obj = 'Inside';
  else if (!S.employer) obj = 'Go to the Job Center to find work';
  else if (!S.duty) obj = 'Clock in at the ' + LANDMARKS[S.employer].label;
  else {
    const near = calls.slice().sort((a, b) => hyp(player, a) - hyp(player, b))[0];
    obj = near ? near.def.name + ' · ' + Math.round(hyp(player, near)) + ' m · ' + Math.ceil(near.t) + ' s' : 'Patrol the city. Wait for calls.';
  }
  $('objective').textContent = obj;

  const pr = getPrompt();
  const working = calls.find(c => c.working);
  const bA = $('bAction');
  bA.disabled = !pr && !working;
  bA.textContent = working ? 'WORKING' : (pr ? pr.label : 'USE');
  $('bJump').disabled = player.mode !== 'foot';
  const prog = $('progress');
  if (working) {
    prog.style.display = 'block';
    $('progFill').style.width = clamp(working.prog / working.def.actTime * 100, 0, 100).toFixed(1) + '%';
  } else prog.style.display = 'none';
  $('toast').textContent = toastT > 0 ? toastText : '';
  drawMini();
}

// ================= Main loop =================
let lastT = performance.now();
function frame(now) {
  const dt = Math.min((now - lastT) / 1000, 0.05);
  lastT = now;
  clock += dt;
  toastT -= dt;
  updateTraffic(dt);
  updateSignals();

  if (gameOn && !paused) {
    const [thr0, str] = readInput();
    if (player.mode === 'car') {
      const brake = keys.Space ? -1 : thr0;
      stepCar(vehicle, dt, brake, str);
      player.x = vehicle.x; player.z = vehicle.z;
      collideTraffic();
    } else {
      if (flying) stepFly(dt, thr0, str); else stepFoot(dt, thr0, str);
    }
    if (loc === 'out' && S.duty) {
      spawnT -= dt;
      if (spawnT <= 0) { spawnCall(); spawnT = 14 + Math.random() * 10; }
    }
    updateCalls(dt);
    updateHUD();
  }
  if (gameOn) updateCharacter();
  if (vehicle) updateLights(vehicle.lights, vehicle.siren, clock);
  if (jobCar && jobCar !== vehicle) updateLights(jobCar.lights, jobCar.siren, clock);
  updateCameraRig(dt);
  if (gameOn) {
    placeMark($('markOwn'), ownedCar);
    placeMark($('markJob'), jobCar && S.duty ? jobCar : null);
  }
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

function resize() {
  renderer.setSize(window.innerWidth, window.innerHeight, false);
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });

// ================= Founder panel (cheats, session only) =================
function founderSay(t) { say('[Founder] ' + t); }
function cheatEnable() { cheatUsed = true; }
function stepFly(dt, thr, str) {
  const fx = -Math.sin(cam.yaw), fz = -Math.cos(cam.yaw), rx = Math.cos(cam.yaw), rz = -Math.sin(cam.yaw);
  let dx = fx * thr - rx * str, dz = fz * thr - rz * str;
  const mag = Math.hypot(dx, dz);
  player.moving = mag > 0.05;
  if (player.moving) {
    dx /= mag; dz /= mag;
    player.h += clamp(wrap(Math.atan2(-dx, -dz) - player.h), -12 * dt, 12 * dt);
    const sp = 40 * Math.min(1, mag);
    player.x += dx * sp * dt;
    player.z += dz * sp * dt;
    player.phase += dt * 6;
  }
  if (keys.Space) player.y += 25 * dt;
  if (keys.ShiftLeft || keys.ShiftRight || keys.KeyC) player.y -= 25 * dt;
  player.y = clamp(player.y, 0.5, 600);
  player.jy = 0; player.vy = 0; player.onGround = false;
}
function toggleFly(on) {
  cheatEnable();
  flying = on === undefined ? !flying : on;
  if (player.mode === 'car') vehicle = null;
  if (flying) {
    player.mode = 'fly';
    player.y = Math.max(player.y, surfaceAt(player.x, player.z) + 8);
  } else {
    player.mode = 'foot';
    player.jy = 0; player.vy = 0; player.onGround = true;
    player.y = surfaceAt(player.x, player.z);
  }
  founderSay(flying ? 'Flight on. Space up, Shift down.' : 'Flight off.');
}
function tpTo(x, z) {
  cheatEnable();
  if (loc !== 'out') { loc = 'out'; scene.fog = FOG; }
  if (player.mode === 'car') vehicle = null;
  player.x = x; player.z = z;
  if (flying) {
    player.mode = 'fly';
    player.y = Math.max(player.y, surfaceAt(x, z) + 8);
  } else {
    player.mode = 'foot';
    player.jy = 0; player.vy = 0; player.onGround = true;
    player.y = surfaceAt(x, z);
  }
  camReady = false;
  founderSay('Teleported.');
}
function tpLandmark(key) {
  const L = LANDMARKS[key];
  const d = L.door || { x: BCX[L.bi], z: BCZ[L.bj] + 18 };
  tpTo(d.x, d.z + 2.5);
}
function spawnCheatCar(id) {
  if (!VEH[id] || !CARSPEC[id]) { founderSay('Unknown car.'); return; }
  cheatEnable();
  const x = player.x - Math.sin(player.h) * 6, z = player.z - Math.cos(player.h) * 6;
  CHEAT_CARS.push(makeCarObj(id, x, z, player.h, CARSPEC[id].body));
  founderSay('Spawned ' + VEH[id].name + '.');
}
function cheatXp(job, n) {
  cheatEnable();
  const g = addXp(job, n);
  founderSay('+' + n + ' XP to ' + JOBS[job].name + (g ? ' (rank up to ' + S.lvl[job] + ')' : '') + '.');
}
const JOB_ALIAS = { fire: 'fire', firefighter: 'fire', police: 'police', ems: 'ems', medic: 'ems', paramedic: 'ems' };
function runCommand(raw) {
  const parts = raw.trim().replace(/^\//, '').split(/\s+/);
  const cmd = (parts[0] || '').toLowerCase(), a = parts.slice(1);
  if (cmd === 'fly') toggleFly(a[0] === 'on' ? true : a[0] === 'off' ? false : undefined);
  else if (cmd === 'tp') {
    if (a.length >= 2 && !isNaN(a[0]) && !isNaN(a[1])) tpTo(+a[0], +a[1]);
    else {
      const s = a.join(' ').toLowerCase();
      const k = Object.keys(LANDMARKS).find(key => key === s || LANDMARKS[key].label.toLowerCase() === s);
      if (k) tpLandmark(k); else founderSay('Places: ' + Object.keys(LANDMARKS).join(', ') + ', or x z.');
    }
  } else if (cmd === 'car') spawnCheatCar(a[0]);
  else if (cmd === 'xp') {
    const job = JOB_ALIAS[(a[0] || '').toLowerCase()], n = parseInt(a[1], 10);
    if (job && n > 0) cheatXp(job, n); else founderSay('Usage: /xp fire|police|ems amount');
  } else if (cmd === 'money') {
    const n = parseInt(a[0], 10);
    if (n) { cheatEnable(); S.money += n; founderSay('+$' + n + '.'); }
  } else founderSay('Commands: /fly on|off, /tp place or x z, /car id, /xp job amount, /money amount');
}
function openFounder() {
  const places = Object.keys(LANDMARKS).map(k => '<button data-fa="tp" data-arg="' + k + '">' + LANDMARKS[k].label + '</button>').join('');
  const cars = Object.keys(VEH).map(k => '<button data-fa="car" data-arg="' + k + '">' + VEH[k].name + '</button>').join('');
  const xps = ['fire', 'police', 'ems'].map(j => '<button data-fa="xp" data-arg="' + j + '">+1000 XP · ' + JOBS[j].name + '</button>').join('');
  openPanel('<h1>Founder panel</h1>' +
    '<p>Cheats are not saved. Once you use one, progress saving is off until you reload, so your real save is safe.</p>' +
    '<div class="field"><input id="cmd" placeholder="/fly on, /tp fire, /car sedan, /xp police 500"></div>' +
    '<button data-fa="cmd">Run command</button>' +
    '<h2>Flight</h2><div class="opts"><button data-fa="fly">Toggle flight</button></div>' +
    '<h2>Fly to</h2><div class="opts">' + places + '</div>' +
    '<h2>Spawn car</h2><div class="opts">' + cars + '</div>' +
    '<h2>XP</h2><div class="opts">' + xps + '</div>' +
    '<button data-act="close">Close</button>');
}
panel.addEventListener('click', e => {
  const b = e.target.closest('[data-fa]');
  if (!b) return;
  ensureAudio();
  const a = b.dataset.fa, g = b.dataset.arg;
  if (a === 'cmd') { runCommand(document.getElementById('cmd').value); closePanel(); }
  else if (a === 'fly') { toggleFly(); closePanel(); }
  else if (a === 'tp') { tpLandmark(g); closePanel(); }
  else if (a === 'car') { spawnCheatCar(g); closePanel(); }
  else if (a === 'xp') { cheatXp(g, 1000); closePanel(); }
});
$('bFounder').addEventListener('click', () => { ensureAudio(); if (gameOn) openFounder(); });

// ================= Start =================
load();
winTex = makeWinTex();
fireTex = radialTex('rgba(255,250,200,1)', 'rgba(255,120,30,0.8)');
smokeTex = radialTex('rgba(120,120,120,0.9)', 'rgba(80,80,80,0.5)');
buildWorld();
buildInteriors();
spawnTraffic(16);
if (S.personal) ownedCar = makeCarObj(S.personal.id, S.personal.x, S.personal.z, S.personal.h, S.personal.color);
resize();
openTitleMenu();
requestAnimationFrame(frame);
</script>
