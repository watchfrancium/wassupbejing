<style>
:root{--g:rgba(12,16,24,.8);--ln:rgba(255,255,255,.12);--ink:#f3f6fa;--mute:#93a0b4;--am:#ffb547;--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:linear-gradient(#5f9ad6,#cfe2f1 52%,#cfe2f1);color:var(--ink);font-family:-apple-system,system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.hide{display:none!important}
#gl{position:fixed;inset:0;width:100%;height:100%}
#rotate{position:fixed;inset:0;z-index:99;display:none;align-items:center;justify-content:center;text-align:center;padding:32px;background:#0a0e14;color:var(--mute)}
@media (orientation:portrait){#rotate{display:flex}}
.glass{background:var(--g);border:1px solid var(--ln);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 12px 34px rgba(0,0,0,.35)}
#hud{position:fixed;inset:0;pointer-events:none}.p{pointer-events:auto}
#pcard{position:absolute;left:calc(var(--sl) + 12px);top:calc(var(--st) + 12px);width:200px;border-radius:16px;padding:11px 13px}
#pname{font-weight:700;font-size:15px}#pjob{font-size:12px;color:var(--mute);margin-top:2px}
#cash{font-size:21px;font-weight:800;margin-top:6px}
#rep{height:5px;border-radius:3px;background:rgba(255,255,255,.14);margin-top:7px;overflow:hidden}#repf{height:100%;background:var(--am)}
#limit{position:absolute;left:calc(var(--sl) + 12px);top:calc(var(--st) + 140px);width:60px;background:#fff;color:#111;border:3px solid #111;border-radius:9px;text-align:center;padding:3px 0}
#limit small{display:block;font-size:8px;font-weight:800}#limit b{font-size:24px;line-height:1.1}#limit.over{border-color:#e03;color:#b3261e;background:#fff0ee}
#mini{position:absolute;right:calc(var(--sr) + 12px);top:calc(var(--st) + 12px);width:124px;height:124px;border-radius:50%;border:2px solid #fff;box-shadow:0 8px 24px rgba(0,0,0,.4)}
#obj{position:absolute;left:50%;top:calc(var(--st) + 14px);transform:translateX(-50%);padding:8px 16px;border-radius:99px;font-size:14px;font-weight:600;max-width:46vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#obj em{font-style:normal;color:var(--mute);margin-left:8px}
#toast{position:absolute;left:50%;top:calc(var(--st) + 62px);transform:translateX(-50%);opacity:0;transition:opacity .25s;padding:8px 16px;border-radius:12px;font-size:14px;font-weight:600;color:#ffe08a;white-space:nowrap}
#toast.show{opacity:1}
#prog{position:absolute;right:calc(var(--sr) + 14px);bottom:calc(var(--sb) + 140px);width:160px;height:6px;border-radius:3px;background:rgba(255,255,255,.2);overflow:hidden}#progf{height:100%;width:0;background:var(--am)}
#joy{position:absolute;left:calc(var(--sl) + 18px);bottom:calc(var(--sb) + 18px);width:122px;height:122px;border-radius:50%;background:rgba(255,255,255,.12);border:1.5px solid rgba(255,255,255,.3)}
#knob{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#aab7c8);pointer-events:none}
#dock{position:absolute;right:calc(var(--sr) + 14px);bottom:calc(var(--sb) + 14px);display:flex;flex-direction:column;align-items:flex-end;gap:10px}
#row{display:flex;gap:9px}
.rb{width:56px;height:56px;border-radius:50%;font-size:11px;font-weight:700;background:linear-gradient(#3c485a,#10141c);border:1px solid rgba(255,255,255,.22);box-shadow:0 6px 16px rgba(0,0,0,.45)}
.rb:active{transform:scale(.92)}.rb:disabled{opacity:.35}.rb.on{background:linear-gradient(#5b9bff,#2b63d6)}
#bAction{height:70px;min-width:168px;padding:0 20px;border-radius:35px;font-size:15px;font-weight:800;background:linear-gradient(#ff7a5c,#d0382a);box-shadow:0 10px 24px rgba(208,56,42,.45)}
#bAction:disabled{background:linear-gradient(#4a5566,#2a313c);box-shadow:none;opacity:.7}
#overlay{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:rgba(3,6,10,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#sheet{position:relative;width:min(560px,94vw);max-height:90vh;overflow:auto;border-radius:22px;padding:22px 20px}
#sheet h1{margin:0 0 4px;font-size:21px}#sheet p{margin:4px 0 12px;color:var(--mute);font-size:14px}
#sheet h2{font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--mute);margin:16px 0 8px}
#sheet input,#creator input{width:100%;font:inherit;font-size:16px;padding:12px;border-radius:12px;border:1px solid var(--ln);background:rgba(0,0,0,.35);color:var(--ink);outline:0;margin:6px 0;user-select:text;-webkit-user-select:text}
.x{position:absolute;right:12px;top:12px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.1)}
.item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid var(--ln);margin-bottom:9px}
.item b{font-size:15px}.item small{display:block;color:var(--mute);font-size:12px;margin-top:2px}
