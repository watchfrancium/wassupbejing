<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">

<title>Dispatch City</title>
<style>
:root{--glass:rgba(12,16,24,.78);--line:rgba(255,255,255,.1);--ink:#f3f6fa;--mute:#93a0b4;--amber:#ffb547;--red:#ff5a4e;--green:#3ddc84;--sa-t:env(safe-area-inset-top,0px);--sa-b:env(safe-area-inset-bottom,0px);--sa-l:env(safe-area-inset-left,0px);--sa-r:env(safe-area-inset-right,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#d9ebf7;color:var(--ink);font-family:-apple-system,"SF Pro Text",system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.hide{display:none!important}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
#rotate{position:fixed;inset:0;z-index:99;display:none;align-items:center;justify-content:center;text-align:center;padding:32px;background:#0a0e14;font-size:18px;color:var(--mute)}
@media (orientation:portrait){#rotate{display:flex}}
.glass{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(16px) saturate(1.2);-webkit-backdrop-filter:blur(16px) saturate(1.2);box-shadow:0 14px 40px rgba(0,0,0,.35)}
#hud{position:fixed;inset:0;pointer-events:none}
.p{pointer-events:auto}
#pcard{position:absolute;left:calc(var(--sa-l) + 12px);top:calc(var(--sa-t) + 12px);width:210px;border-radius:18px;padding:12px 14px}
#pname{font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px}
#pname i{width:8px;height:8px;border-radius:50%;background:var(--mute);flex:none}
#pname i.on{background:var(--green);box-shadow:0 0 10px var(--green)}
#pjob{font-size:12px;color:var(--mute);margin-top:3px}
#cash{font-size:22px;font-weight:800;margin-top:8px;font-variant-numeric:tabular-nums}
#repbar{height:5px;border-radius:3px;background:rgba(255,255,255,.12);margin-top:8px;overflow:hidden}
#repfill{height:100%;width:50%;background:linear-gradient(90deg,var(--amber),#ffe08a);transition:width .4s}
#mini{position:absolute;right:calc(var(--sa-r) + 12px);top:calc(var(--sa-t) + 12px);width:128px;height:128px;border-radius:50%;border:2px solid rgba(255,255,255,.85);box-shadow:0 10px 30px rgba(0,0,0,.4)}
#obj{position:absolute;left:50%;top:calc(var(--sa-t) + 14px);transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:9px 16px;border-radius:999px;font-size:14px;font-weight:600;max-width:46vw;white-space:nowrap}
#obj b{width:9px;height:9px;border-radius:50%;background:var(--amber);flex:none;animation:pulse 1.6s infinite}
#obj span{overflow:hidden;text-overflow:ellipsis}
#obj em{font-style:normal;color:var(--mute);font-weight:500}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,181,71,.7)}70%{box-shadow:0 0 0 10px rgba(255,181,71,0)}100%{box-shadow:0 0 0 0 rgba(255,181,71,0)}}
#toast{position:absolute;left:50%;top:calc(var(--sa-t) + 66px);transform:translate(-50%,-8px);opacity:0;transition:opacity .25s,transform .25s;padding:8px 16px;border-radius:12px;font-size:14px;font-weight:600;white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis}
#toast.show{opacity:1;transform:translate(-50%,0)}
#chat{position:absolute;left:calc(var(--sa-l) + 12px);top:calc(var(--sa-t) + 150px);width:min(340px,55vw);display:flex;flex-direction:column;align-items:flex-start;gap:4px;pointer-events:none}
#chat div{background:rgba(10,14,22,.6);padding:4px 10px;border-radius:10px;font-size:13px;transition:opacity .6s}
#chat .adm{color:#9fd3ff}
#progress{position:absolute;right:calc(var(--sa-r) + 14px);bottom:calc(var(--sa-b) + 146px);width:160px;height:6px;border-radius:3px;background:rgba(255,255,255,.15);overflow:hidden}
#progFill{height:100%;width:0;background:var(--amber)}
#joy{position:absolute;left:calc(var(--sa-l) + 18px);bottom:calc(var(--sa-b) + 18px);width:124px;height:124px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.06),rgba(255,255,255,.16));border:1.5px solid rgba(255,255,255,.28);box-shadow:inset 0 0 22px rgba(0,0,0,.3)}
#knob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#aab7c8);box-shadow:0 6px 16px rgba(0,0,0,.45);pointer-events:none}
#dock{position:absolute;right:calc(var(--sa-r) + 14px);bottom:calc(var(--sa-b) + 14px);display:flex;flex-direction:column;align-items:flex-end;gap:12px}
#row{display:flex;gap:10px;align-items:flex-end}
.rb{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;letter-spacing:.5px;background:linear-gradient(180deg,rgba(60,72,90,.95),rgba(16,20,28,.95));border:1px solid rgba(255,255,255,.2);box-shadow:0 8px 18px rgba(0,0,0,.45);transition:transform .08s,filter .15s}
.rb:active{transform:scale(.92);filter:brightness(1.25)}
.rb:disabled{opacity:.35}
.rb.on{background:linear-gradient(180deg,#5b9bff,#2b63d6)}
#bAction{height:72px;min-width:170px;padding:0 20px;border-radius:36px;font-size:15px;font-weight:800;letter-spacing:.4px;background:linear-gradient(180deg,#ff7a5c,#d0382a);box-shadow:0 12px 26px rgba(208,56,42,.45),inset 0 1px 0 rgba(255,255,255,.3);transition:transform .08s}
#bAction:active{transform:scale(.96)}
#bAction:disabled{background:linear-gradient(180deg,#4a5566,#2a313c);box-shadow:none;opacity:.7}
#inbar{position:absolute;left:calc(var(--sa-l) + 160px);right:calc(var(--sa-r) + 180px);bottom:calc(var(--sa-b) + 20px);display:flex;align-items:center;gap:10px;padding:8px 14px;border-radius:14px;pointer-events:auto}
#inlabel{font-size:11px;font-weight:800;color:var(--amber);letter-spacing:.8px}
#inbox{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--ink);font:inherit;font-size:16px;padding:6px 0;user-select:text;-webkit-user-select:text}
#overlay{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;background:rgba(3,6,10,.5);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);animation:fade .2s}
@keyframes fade{from{opacity:0}}
#sheet{position:relative;width:100%;max-height:88vh;overflow:auto;border-radius:24px 24px 0 0;padding:22px 20px calc(var(--sa-b) + 22px);animation:up .3s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@media (min-width:640px){#overlay{align-items:center}#sheet{width:min(560px,92vw);border-radius:24px;max-height:86vh}}
#sheet h1{margin:0 0 4px;font-size:22px;font-weight:800}
#sheet p{margin:4px 0 12px;color:var(--mute);font-size:14px;line-height:1.45}
#sheet h2{font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--mute);margin:20px 0 10px}
.x{position:absolute;right:14px;top:14px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.1)}
.item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px;border-radius:16px;background:rgba(255,255,255,.04);border:1px solid var(--line);margin-bottom:10px}
.item .t{font-weight:700;font-size:15px}
.item .d{font-size:12px;color:var(--mute);margin-top:3px}
.btn{padding:12px 16px;border-radius:12px;font-weight:700;font-size:14px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);min-width:104px;transition:transform .08s,background .15s;white-space:nowrap}
.btn:not(:disabled):active{transform:scale(.96)}
.btn:disabled{opacity:.4}
.btn.pri{background:linear-gradient(180deg,#ffb547,#f08a1c);color:#1b1206;border-color:transparent}
.btn.full{width:100%;margin-top:8px;min-height:52px;font-size:16px}
.chip{display:inline-block;padding:3px 10px;border-radius:999px;background:rgba(255,181,71,.15);color:var(--amber);font-size:12px;font-weight:700}
#title{position:fixed;inset:0;z-index:15;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:linear-gradient(180deg,rgba(6,10,16,.05),rgba(6,10,16,.65));animation:fade .6s}
#title h1{margin:0;font-size:clamp(38px,9vw,64px);font-weight:900;letter-spacing:8px;background:linear-gradient(180deg,#fff 40%,#b5c6da);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 22px rgba(0,0,0,.5))}
#title .tag{font-size:12px;letter-spacing:3px;text-transform:uppercase;color:var(--amber);margin:10px 0 36px}
.big{padding:17px 72px;border-radius:999px;font-size:18px;font-weight:800;letter-spacing:1px;color:#1b1206;background:linear-gradient(180deg,#ffc463,#f08a1c);box-shadow:0 14px 34px rgba(240,138,28,.45),inset 0 1px 0 rgba(255,255,255,.4);transition:transform .1s}
.big:active{transform:scale(.96)}
#creator{position:fixed;inset:0;z-index:15;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(3,6,10,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#creator .glass{width:min(480px,100%);border-radius:24px;padding:24px;max-height:92vh;overflow:auto}
#creator label{font-size:11px;color:var(--mute);font-weight:700;letter-spacing:1px}
#creator input{display:block;width:100%;font:inherit;font-size:17px;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.35);color:var(--ink);outline:0;margin:8px 0 6px}
#creator input:focus{border-color:var(--amber)}
.sw-row{display:flex;align-items:center;justify-content:space-between;margin:14px 0}
.sw-row>span{font-size:13px;color:var(--mute);font-weight:600}
.sws{display:flex;gap:10px}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid rgba(255,255,255,.15);transition:transform .15s}
.sw.on{border-color:#fff;transform:scale(1.14);box-shadow:0 0 0 3px rgba(255,181,71,.6)}
</style></head>

const xs=axis(),zs=axis();

rowT[3]=rowT[9]='secondary';colT[4]=colT[8]='secondary';

function H(x,z){
  const r=Math.hypot(x,z);

  h=h*s+.6*(1-s);
  const w=1-smooth(22,60,Math.abs(z-RIVER(x)));
  return h*(1-w)-4*w;

// Batched building geometry: one mesh for all boxes, vertex-coloured, with window UVs.
const BAT={p:[],n:[],c:[],u:[]};
const HEX=c=>[((c>>16)&255)/255,((c>>8)&255)/255,(c&255)/255];
function quad(a,b,c,d,n,col,uvf){
  const e1=[b[0]-a[0],b[1]-a[1],b[2]-a[2]],e2=[c[0]-a[0],c[1]-a[1],c[2]-a[2]];
  const cr=[e1[1]*e2[2]-e1[2]*e2[1],e1[2]*e2[0]-e1[0]*e2[2],e1[0]*e2[1]-e1[1]*e2[0]];
  const f=cr[0]*n[0]+cr[1]*n[1]+cr[2]*n[2]<0;
  const tris=f?[[a,c,b],[a,d,c]]:[[a,b,c],[a,c,d]];
  for(const t of tris)for(const v of t){BAT.p.push(v[0],v[1],v[2]);BAT.n.push(n[0],n[1],n[2]);BAT.c.push(col[0],col[1],col[2]);const q=uvf(v);BAT.u.push(q[0],q[1])}
}
function box(x0,y0,z0,x1,y1,z1,wall,roof){
  const w=HEX(wall),r=HEX(roof);
  const ux=v=>[v[2]/6,v[1]/4],uz=v=>[v[0]/6,v[1]/4],u0=()=>[0,0];
  quad([x1,y0,z0],[x1,y1,z0],[x1,y1,z1],[x1,y0,z1],[1,0,0],w,ux);
  quad([x0,y0,z1],[x0,y1,z1],[x0,y1,z0],[x0,y0,z0],[-1,0,0],w,ux);
  quad([x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1],[0,0,1],w,uz);
  quad([x1,y0,z0],[x0,y0,z0],[x0,y1,z0],[x1,y1,z0],[0,0,-1],w,uz);
  quad([x0,y1,z0],[x1,y1,z0],[x1,y1,z1],[x0,y1,z1],[0,1,0],r,u0);
}

function buildTerrain(){

const ROAD_GRID=new Map(),ROAD_LINES=[],WATERS=[],EXT=[],TREES=[];
const gk=(i,j)=>i+','+j;
function roadY(x,z){return Math.max(H(x,z)+.35,4.6*(1-smooth(34,70,Math.abs(z-RIVER(x)))))}
function surfaceAt(x,z){
  const ci=Math.floor(x/GRID),cj=Math.floor(z/GRID);let best=null,bd=1e9;
  for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++){
    const L=ROAD_GRID.get(gk(ci+a,cj+b));if(!L)continue;
    for(const p of L){const dx=p.x-x,dz=p.z-z,d=dx*dx+dz*dz;if(d<bd&&d<(p.hw+.8)*(p.hw+.8)){bd=d;best=p}}

function ribbon(pts,w,mat){
  const n=pts.length,pos=new Float32Array(n*6),uv=new Float32Array(n*4),idx=[];let acc=0;
  for(let i=0;i<n;i++){
    const a=pts[Math.max(0,i-1)],b=pts[Math.min(n-1,i+1)];
    let tx=b.x-a.x,tz=b.z-a.z;const tl=Math.hypot(tx,tz)||1;tx/=tl;tz/=tl;
    const nx=-tz*w/2,nz=tx*w/2,p=pts[i];
    pos.set([p.x+nx,p.y,p.z+nz,p.x-nx,p.y,p.z-nz],i*6);
    if(i>0)acc+=Math.hypot(p.x-pts[i-1].x,p.z-pts[i-1].z);
    uv.set([0,acc/32,1,acc/32],i*4);
    if(i<n-1){const k=i*2;idx.push(k,k+2,k+1,k+1,k+2,k+3)}

  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(pos,3));

const DECK=new THREE.MeshLambertMaterial({color:0x8d9399,side:THREE.DoubleSide});
function strip(A,B){

  for(let i=0;i<n;i++){pos.set([A[i].x,A[i].y,A[i].z,B[i].x,B[i].y,B[i].z],i*6);if(i<n-1){const k=i*2;idx.push(k,k+2,k+1,k+1,k+2,k+3)}}

  scene.add(new THREE.Mesh(g,DECK));
}
function slab(run,w,t){
  const A=[],B=[],C=[],D=[];
  run.forEach((p,i)=>{
    const a=run[Math.max(0,i-1)],b=run[Math.min(run.length-1,i+1)];
    let tx=b.x-a.x,tz=b.z-a.z;const tl=Math.hypot(tx,tz)||1;tx/=tl;tz/=tl;
    const nx=-tz*w/2,nz=tx*w/2;
    A.push({x:p.x+nx,y:p.y,z:p.z+nz});B.push({x:p.x-nx,y:p.y,z:p.z-nz});
    C.push({x:p.x+nx,y:p.y-t,z:p.z+nz});D.push({x:p.x-nx,y:p.y-t,z:p.z-nz});
  });
  strip(A,C);strip(B,D);strip(C,D);
}
function addRoad(pts2,type){
  const w=WID[type],pts=pts2.map(p=>({x:p.x,z:p.z,y:roadY(p.x,p.z)}));
  for(const p of pts){
    const rp={x:p.x,y:p.y,z:p.z,hw:w/2},k=gk(Math.floor(p.x/GRID),Math.floor(p.z/GRID));
    if(!ROAD_GRID.has(k))ROAD_GRID.set(k,[]);ROAD_GRID.get(k).push(rp);
  }
  ROAD_LINES.push({pts:pts2,w,type});
  ribbon(pts,w,roadMat(type));
  let run=[];const runs=[];
  for(const p of pts){if(p.y-H(p.x,p.z)>1.2)run.push(p);else{if(run.length>1)runs.push(run);run=[]}}
  if(run.length>1)runs.push(run);
  for(const r of runs)slab(r,w,.9);
  for(let k=0;k<pts.length;k+=3){
    const p=pts[k],gh=H(p.x,p.z);
    if(p.y-gh>1.5){const hh=p.y-gh;part(new THREE.BoxGeometry(2.4,hh,2.4),0x8f949b,p.x,gh+hh/2,p.z,scene);EXT.push({x0:p.x-1.2,x1:p.x+1.2,z0:p.z-1.2,z1:p.z+1.2,top:p.y})}
  }
}
const lineX=(z,a,b)=>{const p=[];for(let x=a;x<=b+.01;x+=6)p.push({x,z});return p};

const PAL={down:[0x9ea9b6,0x7f8d9e,0xb9c2cc,0x8a96a6],mid:[0xd9c8a7,0xc7b596,0xe6dfcd,0xbfb4a1],sub:[0xeee8dc,0xd7b89a,0xbfcbd1,0xf2efe6],ind:[0x8e99a3,0xb4a390,0x7b8590]};
const ROOF=0x59616b;
const pick=a=>a[(R()*a.length)|0];
function solid(x0,x1,z0,z1){EXT.push({x0,x1,z0,z1})}
function building(x0,z0,x1,z1,h,pal,base){
  box(x0,base,z0,x1,base+h,z1,pick(pal),ROOF);solid(x0,x1,z0,z1);
  if(R()<.35)box(x0+(x1-x0)*.3,base+h,z0+(z1-z0)*.3,x0+(x1-x0)*.5,base+h+2.5,z0+(z1-z0)*.5,0xcfd3d8,0x9aa1aa);
}
function buildBlock(i,j){
  const x0=bx0[i],x1=bx1[i],z0=bz0[j],z1=bz1[j],cx=(x0+x1)/2,cz=(z0+z1)/2,d=Math.hypot(cx,cz);
  const key=gk(i,j);
  if(LMK[key]){landmark(LMK[key],cx,cz);return}
  const ind=i>=9&&j<=3;
  if(!ind&&R()<.12){
    box(x0,.5,z0,x1,.7,z1,0x6fa35b,0x6fa35b);
    for(let k=0;k<12;k++)TREES.push({x:x0+R()*(x1-x0),z:z0+R()*(z1-z0),s:.9+R()*.5});
    return;
  }
  const m=5,lw=(x1-x0-2*m-3)/2,lh=(z1-z0-2*m-3)/2;
  for(let a=0;a<2;a++)for(let b=0;b<2;b++){
    if(!ind&&R()<.15)continue;
    const lx=x0+m+a*(lw+3),ly=z0+m+b*(lh+3),lx1=lx+lw,ly1=ly+lh,base=H(lx+lw/2,ly+lh/2);
    if(ind){building(lx+2,ly+2,lx1-2,ly1-2,8+R()*6,PAL.ind,base);continue}
    if(d<230){
      const h=45+R()*80;
      if(R()<.5)building(lx,ly,lx1,ly1,h,PAL.down,base);
      else{const mx=lx+lw*.55;building(lx,ly,mx,ly1,h,PAL.down,base);building(mx+1,ly+lh*.3,lx1,ly1,h*.5+R()*15,PAL.down,base)}

      building(lx+1,ly+1,lx1-1,ly1-1,14+R()*20,PAL.mid,base);
      if(R()<.3)building(lx+lw*.1,ly+lh*.1,lx+lw*.45,ly+lh*.45,10+R()*8,PAL.mid,base);
    }else{
      for(let h=0;h<2;h++){
        const hx=lx+lw*(.1+h*.45),hz=ly+lh*(.2+R()*.3);
        building(hx,hz,hx+lw*.4,hz+lh*.4,5+R()*3,PAL.sub,base);
        TREES.push({x:hx+lw*.2,z:hz+lh*.5+6,s:.9+R()*.5});
      }
    }
  }
}

const mergeMat=[];
function mergeParts(items){
  const list=[];let total=0;
  for(const it of items){
    const gg=it.geo.index?it.geo.toNonIndexed():it.geo.clone();
    const q=new THREE.Quaternion().setFromEuler(new THREE.Euler(it.rx||0,0,it.rz||0));
    gg.applyMatrix4(new THREE.Matrix4().compose(new THREE.Vector3(it.x,it.y,it.z),q,new THREE.Vector3(1,1,1)));
    list.push({geo:gg,col:new THREE.Color(it.col)});total+=gg.attributes.position.count;
  }
  const pos=new Float32Array(total*3),nor=new Float32Array(total*3),col=new Float32Array(total*3);let o=0;
  for(const e of list){
    const n=e.geo.attributes.position.count;
    pos.set(e.geo.attributes.position.array,o*3);nor.set(e.geo.attributes.normal.array,o*3);
    for(let k=0;k<n;k++)col.set([e.col.r,e.col.g,e.col.b],(o+k)*3);
    o+=n;
  }
  const out=new THREE.BufferGeometry();
  out.setAttribute('position',new THREE.BufferAttribute(pos,3));
  out.setAttribute('normal',new THREE.BufferAttribute(nor,3));
  out.setAttribute('color',new THREE.BufferAttribute(col,3));
  return out;
}
const I=(geo,col,x,y,z,rx,rz)=>({geo,col,x,y,z,rx,rz});
const rboxCache={};
function rbox(w,h,d,r){
  const key=[w,h,d,r].join('|');if(rboxCache[key])return rboxCache[key];
  const b=Math.min(.12,r),W=w-2*b,H2=h-2*b,Rr=Math.max(.01,r-b),s=new THREE.Shape(),x=-W/2,y=-H2/2;
  s.moveTo(x+Rr,y);s.lineTo(x+W-Rr,y);s.quadraticCurveTo(x+W,y,x+W,y+Rr);
  s.lineTo(x+W,y+H2-Rr);s.quadraticCurveTo(x+W,y+H2,x+W-Rr,y+H2);
  s.lineTo(x+Rr,y+H2);s.quadraticCurveTo(x,y+H2,x,y+H2-Rr);
  s.lineTo(x,y+Rr);s.quadraticCurveTo(x,y,x+Rr,y);
  const depth=Math.max(.01,d-2*b);
  const g=new THREE.ExtrudeGeometry(s,{depth,bevelEnabled:true,bevelThickness:b,bevelSize:b,bevelSegments:2,curveSegments:3});
  g.translate(0,0,-depth/2);rboxCache[key]=g;return g;
}
let TIRE=null;
function buildCar(sp,color){

let OUT=[];
function collide(o,Rad,list){
  for(const b of list){
    if(b.water&&o.yLevel>WATER_Y+1.2)continue;
    if(b.top!==undefined&&o.yLevel>b.top-1.5)continue;
    const nx=clamp(o.x,b.x0,b.x1),nz=clamp(o.z,b.z0,b.z1);
    const dx=o.x-nx,dz=o.z-nz,d2=dx*dx+dz*dz;
    if(d2<Rad*Rad){
      if(d2>1e-6){const d=Math.sqrt(d2),p=(Rad-d)/d;o.x+=dx*p;o.z+=dz*p}
      else{const ex=Math.min(o.x-b.x0,b.x1-o.x),ez=Math.min(o.z-b.z0,b.z1-o.z);
        if(ex<ez)o.x=(o.x-b.x0<b.x1-o.x)?b.x0-Rad:b.x1+Rad;else o.z=(o.z-b.z0<b.z1-o.z)?b.z0-Rad:b.z1+Rad}
      if(typeof o.speed==='number')o.speed*=.6;
    }
  }
}
const clampMap=o=>{o.x=clamp(o.x,-MAPH,MAPH);o.z=clamp(o.z,-MAPH,MAPH)};
const player={x:0,z:0,h:0,y:0,jy:0,vy:0,onGround:true,mode:'foot',moving:false,phase:0,yLevel:0,g:null,legL:null,legR:null,armL:null,armR:null};
const solidsNow=()=>loc==='out'?OUT:INT[loc].solids;

  legL.position.set(-.17,.9,0);legR.position.set(.17,.9,0);
  for(const lg of[legL,legR]){part(new THREE.CylinderGeometry(.13,.12,.9,6),a.pants,0,-.45,0,lg);part(new THREE.BoxGeometry(.22,.14,.34),0x1b1b1f,0,-.92,-.05,lg);g.add(lg)}
  part(new THREE.BoxGeometry(.6,.75,.34),a.shirt,0,1.25,0,g);
  if(S.duty&&S.employer)part(new THREE.BoxGeometry(.62,.5,.06),0xf2c94c,0,1.25,-.19,g);
  const armL=new THREE.Group(),armR=new THREE.Group();
  armL.position.set(-.42,1.6,0);armR.position.set(.42,1.6,0);
  for(const ar of[armL,armR]){part(new THREE.CylinderGeometry(.09,.08,.7,6),a.shirt,0,-.35,0,ar);part(new THREE.SphereGeometry(.09,6,5),a.skin,0,-.75,0,ar);g.add(ar)}
  part(new THREE.SphereGeometry(.2,10,8),a.skin,0,1.92,0,g);
  part(new THREE.SphereGeometry(.215,8,5,0,Math.PI*2,0,Math.PI/2),a.hair,0,1.97,.02,g);

function stepFoot(dt,thr,str){
  const fx=-Math.sin(cam.yaw),fz=-Math.cos(cam.yaw),rx=Math.cos(cam.yaw),rz=-Math.sin(cam.yaw);
  let dx=fx*thr-rx*str,dz=fz*thr-rz*str;const mag=Math.hypot(dx,dz);
  player.moving=mag>.05;
  if(player.moving){
    dx/=mag;dz/=mag;
    player.h+=clamp(wrap(Math.atan2(-dx,-dz)-player.h),-12*dt,12*dt);
    const sp=6.5*Math.min(1,mag);
    player.x+=dx*sp*dt;player.z+=dz*sp*dt;player.phase+=dt*sp*1.4;
  }
  collide(player,.6,solidsNow());
  if(loc==='out'){clampMap(player);player.yLevel=surfaceAt(player.x,player.z)}else player.yLevel=0;
  player.vy-=24*dt;player.jy+=player.vy*dt;
  if(player.jy<=0){player.jy=0;player.vy=0;player.onGround=true}else player.onGround=false;
  player.y=player.yLevel+player.jy;
}
function stepFly(dt,thr,str){
  const fx=-Math.sin(cam.yaw),fz=-Math.cos(cam.yaw),rx=Math.cos(cam.yaw),rz=-Math.sin(cam.yaw);
  let dx=fx*thr-rx*str,dz=fz*thr-rz*str;const mag=Math.hypot(dx,dz);
  player.moving=mag>.05;
  if(player.moving){dx/=mag;dz/=mag;player.h+=clamp(wrap(Math.atan2(-dx,-dz)-player.h),-12*dt,12*dt);player.x+=dx*40*Math.min(1,mag)*dt;player.z+=dz*40*Math.min(1,mag)*dt;player.phase+=dt*6}
  if(keys.Space)player.y+=25*dt;
  if(keys.ShiftLeft||keys.ShiftRight||keys.KeyC)player.y-=25*dt;
  player.y=clamp(player.y,.5,600);player.jy=0;player.vy=0;player.onGround=false;
}
function jump(){if(player.mode!=='foot'||!player.onGround||!gameOn||paused)return;player.vy=8;player.onGround=false}
function updateCharacter(){
  if(!player.g)return;
  player.g.visible=player.mode!=='car';
  player.g.position.set(player.x,player.y,player.z);player.g.rotation.y=player.h;
  const amp=player.moving&&player.onGround?.7:0,s=Math.sin(player.phase)*amp;
  player.legL.rotation.x=s;player.legR.rotation.x=-s;player.armL.rotation.x=-s*.8;player.armR.rotation.x=s*.8;
  if(!player.onGround){player.legL.rotation.x=.5;player.legR.rotation.x=-.3}
}
function stepCar(o,dt,thr,str){
  if(thr>.05)o.speed+=o.acc*thr*dt;
  else if(thr<-.05){if(o.speed>.5)o.speed-=o.brk*(-thr)*dt;else o.speed-=o.acc*.5*dt}
  else o.speed-=Math.sign(o.speed)*Math.min(Math.abs(o.speed),3*dt);
  o.speed=clamp(o.speed,-8,o.max);
  const k=clamp(Math.abs(o.speed)/8,0,1)*Math.sign(o.speed);
  o.h+=str*o.turn*k*dt;
  o.x+=-Math.sin(o.h)*o.speed*dt;o.z+=-Math.cos(o.h)*o.speed*dt;
  o.yLevel=surfaceAt(o.x,o.z);
  collide(o,2,OUT);clampMap(o);
  const sy=surfaceAt(o.x,o.z);
  if(o.airborne||o.y>sy+.05){o.vy=(o.vy||0)-24*dt;o.y+=o.vy*dt;if(o.y<=sy){o.y=sy;o.vy=0;o.airborne=false}else o.airborne=true}
  else{o.y=sy;o.vy=0}
  const fx=-Math.sin(o.h),fz=-Math.cos(o.h),rx=Math.cos(o.h),rz=-Math.sin(o.h);
  const hf=surfaceAt(o.x+fx*2.2,o.z+fz*2.2),hb=surfaceAt(o.x-fx*2.2,o.z-fz*2.2),hr=surfaceAt(o.x+rx*1.1,o.z+rz*1.1),hl=surfaceAt(o.x-rx*1.1,o.z-rz*1.1);
  const tp=o.airborne?0:Math.atan2(hf-hb,4.4),tr=o.airborne?0:Math.atan2(hr-hl,2.2);
  o.pitch=(o.pitch||0)+(tp-(o.pitch||0))*Math.min(1,dt*10);
  o.roll=(o.roll||0)+(tr-(o.roll||0))*Math.min(1,dt*10);
  o.g.position.set(o.x,o.y,o.z);o.g.rotation.set(o.pitch,o.h,o.roll,'YXZ');
  for(const w of o.wheels)w.rotation.x+=o.speed*dt/.42;
}
function enterCar(v){player.mode='car';vehicle=v;cam.dist=9;cam.pitch=.32;say('Driving '+v.name)}
function exitCar(){
  if(Math.abs(vehicle.speed)>3){say('Stop before getting out');return}
  player.x=vehicle.x+Math.cos(vehicle.h)*2.6;player.z=vehicle.z-Math.sin(vehicle.h)*2.6;
  player.h=vehicle.h+Math.PI/2;player.jy=0;player.vy=0;player.onGround=true;
  player.mode='foot';vehicle=null;cam.dist=6;cam.pitch=.3;
}

const cam={yaw:0,pitch:.3,dist:6,last:-9};
function updateCam(dt){
  if(!gameOn){const a=clock*.05;camera.position.set(Math.cos(a)*420,260,Math.sin(a)*420);camera.lookAt(0,0,0);return}
  const car=player.mode==='car'&&vehicle;

  const py=loc!=='out'?1.8:(car?vehicle.y+1.6:player.y+1.8);

  camera.position.set(px+Math.sin(cam.yaw)*cp*cam.dist,py+sp*cam.dist,pz+Math.cos(cam.yaw)*cp*cam.dist);

}

const jobCallsFor=()=>CALLS[S.employer].filter(d=>S.lvl[S.employer]>=d.min);
function makeFire(){
  const g=new THREE.Group(),ps=[];
  for(let i=0;i<7;i++){const s=new THREE.Sprite(new THREE.SpriteMaterial({map:fireTex,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false}));s.position.set((rnd()-.5)*4,1+rnd()*1.5,(rnd()-.5)*4);s.userData={smoke:false,base:3+rnd()*2,ph:rnd()*6};g.add(s);ps.push(s)}
  for(let i=0;i<4;i++){const s=new THREE.Sprite(new THREE.SpriteMaterial({map:smokeTex,transparent:true,depthWrite:false,opacity:.6}));s.position.set((rnd()-.5)*3,4,(rnd()-.5)*3);s.userData={smoke:true,base:4+rnd()*3,y:4,ph:rnd()*6};g.add(s);ps.push(s)}
  return{g,parts:ps};
}
function animFire(f,t){
  for(const s of f.parts){const u=s.userData;
    if(u.smoke){const rise=(t*1.2+u.ph)%6;s.position.y=u.y+rise;s.material.opacity=.6*(1-rise/6);s.scale.setScalar(u.base*(1+rise*.08))}
    else{const k=.85+.25*Math.sin(t*9+u.ph);s.scale.set(u.base*k,u.base*1.2*k,1)}}
}
function spawnCall(){
  if(!S.duty||!S.employer||calls.length>=3)return;
  const defs=jobCallsFor();if(!defs.length)return;
  const def=defs[(rnd()*defs.length)|0],horiz=rnd()<.5;
  const x=horiz?xs[(rnd()*NS)|0]:xs[0]+rnd()*(xs[NS-1]-xs[0]);
  const z=horiz?zs[0]+rnd()*(zs[NS-1]-zs[0]):zs[(rnd()*NS)|0];
  if(hyp(player,{x,z})<90)return;
  const g=new THREE.Group(),gy=surfaceAt(x,z);g.position.set(x,gy,z);scene.add(g);
  const beam=new THREE.Mesh(new THREE.CylinderGeometry(.6,.6,80,6,1,true),new THREE.MeshBasicMaterial({color:def.color,transparent:true,opacity:.35,depthWrite:false}));
  beam.position.y=40;g.add(beam);
  const ring=new THREE.Mesh(new THREE.CylinderGeometry(4.5,4.5,.1,20),new THREE.MeshBasicMaterial({color:def.color,transparent:true,opacity:.6}));
  ring.position.y=.1;g.add(ring);
  if(def.person){const p=buildPerson(def.person);p.position.x+=3.5;p.position.z+=3;g.add(p)}
  let fire=null;if(def.fx){fire=makeFire();fire.g.position.set(4,0,4);g.add(fire.g)}
  calls.push({def,x,z,g,t:def.time,prog:0,working:false,fire});
  say('New call: '+def.name);
}
function removeCall(c){c.g.traverse(o=>{if(o.geometry)o.geometry.dispose()});scene.remove(c.g);calls=calls.filter(x=>x!==c)}
function clearCalls(){for(const c of calls.slice())removeCall(c)}
const inRange=c=>loc==='out'&&player.mode==='foot'&&hyp(player,c)<5;
function doAction(){
  ensureAudio();
  const c=calls.find(x=>inRange(x)&&!x.working);
  if(!c){say('Get closer on foot');return}
  c.working=true;c.prog=0;say(c.def.action+'...');
}
function updateCalls(dt){
  for(const c of calls.slice()){
    c.t-=dt;
    if(c.working){
      if(!inRange(c)){c.working=false;c.prog=0;say('Action cancelled')}
      else{c.prog+=dt;if(c.prog>=c.def.actTime){completeCall(c);continue}}
    }
    if(c.t<=0){failCall(c);continue}
    if(c.fire)animFire(c.fire,clock);
  }
}
function completeCall(c){
  const pay=c.def.reward+Math.floor(c.t)*2;
  S.money+=pay;S.rep=Math.min(100,S.rep+2);
  const g=addXp(S.employer,c.def.xp);
  removeCall(c);save();
  say(c.def.name+' resolved. +'+money(pay)+(g?'. Rank '+S.lvl[S.employer]:''));
}
function failCall(c){S.rep=Math.max(0,S.rep-4);say('Call lost: '+c.def.name);removeCall(c);save()}

const mc=$('mini').getContext('2d'),MSZ=256,MRANGE=230,MK=MSZ/2/MRANGE;
function drawMini(){
  const c=mc;c.setTransform(1,0,0,1,0,0);c.clearRect(0,0,MSZ,MSZ);
  if(loc!=='out'){c.fillStyle='#0c1118';c.fillRect(0,0,MSZ,MSZ);c.fillStyle='#8d9ab0';c.font='bold 18px system-ui';c.textAlign='center';c.fillText('INDOORS',128,134);return}
  const px=player.x,pz=player.z,X=x=>MSZ/2+(x-px)*MK,Y=z=>MSZ/2+(z-pz)*MK;
  c.save();c.beginPath();c.arc(128,128,128,0,Math.PI*2);c.clip();
  c.fillStyle='#5f9a52';c.fillRect(0,0,MSZ,MSZ);
  c.strokeStyle='#3d8fc4';c.lineWidth=120*MK;c.beginPath();
  for(let x=px-400;x<=px+400;x+=12){const f=x===px-400;f?c.moveTo(X(x),Y(RIVER(x))):c.lineTo(X(x),Y(RIVER(x)))}
  c.stroke();
  c.fillStyle='#bfb8a9';
  for(const b of EXT){if(b.x1<px-MRANGE||b.x0>px+MRANGE||b.z1<pz-MRANGE||b.z0>pz+MRANGE)continue;c.fillRect(X(b.x0),Y(b.z0),(b.x1-b.x0)*MK,(b.z1-b.z0)*MK)}
  c.lineCap='butt';

    r.pts.forEach((p,i)=>i?c.lineTo(X(p.x),Y(p.z)):c.moveTo(X(p.x),Y(p.z)));c.stroke();
  }
  for(const k in LM){const L=LM[k];if(!L.door)continue;c.fillStyle='#'+L.color.toString(16).padStart(6,'0');c.fillRect(X(L.door.x)-4,Y(L.door.z)-4,8,8)}
  for(const cl of calls){c.fillStyle='#'+cl.def.color.toString(16).padStart(6,'0');c.beginPath();c.arc(X(cl.x),Y(cl.z),4,0,7);c.fill()}
  if(ownedCar){c.fillStyle='#4da3ff';c.beginPath();c.arc(X(ownedCar.x),Y(ownedCar.z),3.5,0,7);c.fill()}
  const t=target();
  if(t){
    const dx=t.x-px,dz=t.z-pz,d=Math.hypot(dx,dz),k=Math.min(1,112/(d*MK||1));
    c.fillStyle='#ffb547';c.beginPath();c.arc(128+dx*MK*k,128+dz*MK*k,6,0,7);c.fill();
    c.strokeStyle='#1b1206';c.lineWidth=2;c.stroke();

  c.save();c.translate(128,128);c.rotate(-player.h);
  c.fillStyle='#ffffff';c.strokeStyle='#0b0f16';c.lineWidth=2;c.beginPath();c.moveTo(0,-10);c.lineTo(7,8);c.lineTo(0,4);c.lineTo(-7,8);c.closePath();c.fill();c.stroke();
  c.restore();
  c.fillStyle='#ffb547';c.font='bold 14px system-ui';c.textAlign='center';c.fillText('N',128,18);
  c.restore();
}

  if(!gameOn||paused)return;
  if(e.pointerType==='mouse'&&e.button!==2)return;
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});canvasEl.setPointerCapture(e.pointerId);cam.last=clock;pairLast=null;
});
canvasEl.addEventListener('pointermove',e=>{
  const p=ptrs.get(e.pointerId);if(!p)return;
  const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;cam.last=clock;
  if(ptrs.size===1){cam.yaw-=dx*.007;cam.pitch=clamp(cam.pitch+dy*.005,.05,1.35)}
  else if(ptrs.size>=2){
    const v=[...ptrs.values()],d=Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y);
    if(pairLast)cam.dist=clamp(cam.dist+(pairLast-d)*.04,3,22);
    pairLast=d;
  }
});
const endPtr=e=>{ptrs.delete(e.pointerId);pairLast=null};
canvasEl.addEventListener('pointerup',endPtr);canvasEl.addEventListener('pointercancel',endPtr);
canvasEl.addEventListener('wheel',e=>{cam.dist=clamp(cam.dist+e.deltaY*.01,3,22);e.preventDefault()},{passive:false});

// ===================== Loop =====================
let lastT=performance.now(),hudT=0,spawnTimer=8;
function resize(){renderer.setSize(window.innerWidth,window.innerHeight,false);camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix()}
window.addEventListener('resize',resize);
document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});
function frame(now){
  const dt=Math.min((now-lastT)/1000,.05);lastT=now;clock+=dt;toastT-=dt;
  if(gameOn&&!paused){
    const[thr,str]=readInput();
    if(player.mode==='car'){stepCar(vehicle,dt,keys.Space?-1:thr,str);player.x=vehicle.x;player.z=vehicle.z}
    else if(flying)stepFly(dt,thr,str);
    else stepFoot(dt,thr,str);
    if(loc==='out'&&S.duty){spawnTimer-=dt;if(spawnTimer<=0){spawnCall();spawnTimer=14+rnd()*10}}
    updateCalls(dt);
    updateCharacter();
  }
  if(vehicle)updateLights(vehicle.lights,vehicle.siren,clock);
  if(jobCar&&jobCar!==vehicle)updateLights(jobCar.lights,jobCar.siren,clock);
  if(gameOn)updateWaypoint();
  if(sky)sky.visible=loc==='out';
  updateCam(dt);
  renderer.render(scene,camera);
  hudT+=dt;
  if(hudT>.1){hudT=0;if(gameOn){updateHUD();drawMini()}}
  requestAnimationFrame(frame);
}

// ===================== Start =====================
sky={visible:true};
load();
buildWorld();
sky=scene.children.find(o=>o.geometry&&o.geometry.type==='SphereGeometry'&&o.geometry.parameters.radius===2400);
resize();
openTitle();
requestAnimationFrame(frame);
</script>
